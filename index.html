<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Racing Arena</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
    background:#3ea043;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    background:rgba(0,0,0,0.8);
    padding:12px;
    border-radius:12px;
    width:250px;
}

input,button{
    width:100%;
    margin-top:6px;
    padding:8px;
    border:none;
    border-radius:8px;
    font-size:14px;
}

button{
    background:#00c27a;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00db8a;
}

#scoreboard{
    margin-top:10px;
    max-height:300px;
    overflow:auto;
    font-size:14px;
}
</style>
</head>
<body>

<div id="ui">

<h2>🏁 Racing Arena</h2>

Bots:
<input type="number" id="botCount" value="6" min="2" max="20">

Runden:
<input type="number" id="laps" value="5" min="1" max="50">

<button onclick="startRace()">Rennen starten</button>

<div id="scoreboard"></div>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const trackCenterX = canvas.width/2;
const trackCenterY = canvas.height/2;

const trackOuterRX = 360;
const trackOuterRY = 220;

const trackInnerRX = 220;
const trackInnerRY = 100;

let racers = [];
let raceRunning = false;
let totalLaps = 5;

const colors = [
"#ff4d4d",
"#4da6ff",
"#ffd24d",
"#66ff66",
"#ff66ff",
"#00ffff",
"#ffffff",
"#ff944d",
"#9999ff",
"#ff6699"
];

class Racer{

    constructor(name,color,index){

        this.name = name;
        this.color = color;

        this.angle = Math.PI + (index * 0.15);

        this.radius = (trackOuterRX + trackInnerRX)/2;

        this.x = trackCenterX + Math.cos(this.angle) * 290;
        this.y = trackCenterY + Math.sin(this.angle) * 160;

        this.speed = 1 + Math.random() * 1.5;
        this.targetSpeed = this.speed;

        this.width = 28;
        this.height = 16;

        this.rotation = this.angle + Math.PI/2;

        this.laps = 0;
        this.finished = false;

        this.points = 0;

        this.lastCross = false;

        setInterval(()=>{
            this.targetSpeed = 0.8 + Math.random() * 2.8;
        },1000);
    }

    update(){

        if(this.finished) return;

        this.speed += (this.targetSpeed - this.speed) * 0.02;

        this.angle += this.speed * 0.003;

        this.rotation = this.angle + Math.PI/2;

        this.x = trackCenterX + Math.cos(this.angle) * 290;
        this.y = trackCenterY + Math.sin(this.angle) * 160;

        // Kollisionssystem
        racers.forEach(other=>{

            if(other === this) return;

            const dx = other.x - this.x;
            const dy = other.y - this.y;

            const dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 24){

                const push = (24 - dist) / 2;

                const nx = dx / dist;
                const ny = dy / dist;

                this.x -= nx * push;
                this.y -= ny * push;

                other.x += nx * push;
                other.y += ny * push;

                this.speed *= 0.97;
                other.speed *= 0.97;
            }

        });

        // Runden zählen
        const crossing =
            this.x > trackCenterX + 280 &&
            Math.abs(this.y - trackCenterY) < 40;

        if(crossing && !this.lastCross){

            this.laps++;

            if(this.laps >= totalLaps){
                this.finished = true;
            }
        }

        this.lastCross = crossing;
    }

    draw(){

        ctx.save();

        ctx.translate(this.x,this.y);
        ctx.rotate(this.rotation);

        // Schatten
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(-14,-8,28,16);

        // Auto
        ctx.fillStyle = this.color;
        ctx.fillRect(-14,-8,28,16);

        // Fenster
        ctx.fillStyle = "#222";
        ctx.fillRect(-6,-6,12,12);

        ctx.restore();

        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.fillText(this.name,this.x-18,this.y-16);
    }

}

function drawTrack(){

    // Straße außen
    ctx.beginPath();
    ctx.ellipse(
        trackCenterX,
        trackCenterY,
        trackOuterRX,
        trackOuterRY,
        0,
        0,
        Math.PI*2
    );
    ctx.fillStyle = "#555";
    ctx.fill();

    // Gras innen
    ctx.beginPath();
    ctx.ellipse(
        trackCenterX,
        trackCenterY,
        trackInnerRX,
        trackInnerRY,
        0,
        0,
        Math.PI*2
    );
    ctx.fillStyle = "#3ea043";
    ctx.fill();

    // Mittellinie
    ctx.beginPath();
    ctx.ellipse(
        trackCenterX,
        trackCenterY,
        290,
        160,
        0,
        0,
        Math.PI*2
    );
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.setLineDash([20,15]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Startlinie
    ctx.fillStyle = "white";

    for(let i=0;i<8;i++){

        ctx.fillRect(
            trackCenterX + 280,
            trackCenterY - 40 + i*10,
            10,
            5
        );
    }

}

function updateScoreboard(){

    racers.sort((a,b)=>{

        if(a.laps === b.laps){
            return b.angle - a.angle;
        }

        return b.laps - a.laps;
    });

    let html = "<h3>🏆 Ranking</h3>";

    racers.forEach((r,i)=>{

        html += `
        <div>
        ${i+1}. ${r.name}
        | Runde ${Math.min(r.laps,totalLaps)}/${totalLaps}
        | ${r.points} Punkte
        </div>
        `;
    });

    document.getElementById("scoreboard").innerHTML = html;
}

function finishRace(){

    raceRunning = false;

    const points = [10,7,5,3,1];

    racers.forEach((r,i)=>{
        r.points += points[i] || 0;
    });

    updateScoreboard();

    setTimeout(()=>{
        alert("🏁 Rennen beendet!");
    },200);
}

function startRace(){

    racers = [];

    totalLaps = parseInt(
        document.getElementById("laps").value
    );

    const botCount = parseInt(
        document.getElementById("botCount").value
    );

    for(let i=0;i<botCount;i++){

        racers.push(
            new Racer(
                "Bot "+(i+1),
                colors[i % colors.length],
                i
            )
        );
    }

    raceRunning = true;
}

function loop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawTrack();

    let allFinished = true;

    racers.forEach(r=>{

        if(raceRunning){
            r.update();
        }

        r.draw();

        if(!r.finished){
            allFinished = false;
        }

    });

    updateScoreboard();

    if(raceRunning && allFinished && racers.length > 0){
        finishRace();
    }

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
