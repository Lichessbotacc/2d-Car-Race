<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Racing Arena Elite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1014;
  --panel:#171b21;
  --panel-2:#1f242c;
  --line:#2a3038;
  --accent:#00e0a4;
  --accent-dim:#0a5f48;
  --amber:#ffb300;
  --danger:#ff4d5e;
  --yellow:#ffe066;
  --text:#eef1f5;
  --text-dim:#9aa4b2;
}
*{box-sizing:border-box;}
html,body{margin:0;overflow:hidden;background:var(--bg);font-family:'Inter',Arial,sans-serif;color:var(--text);height:100%;width:100%;}
canvas{display:block;touch-action:none;}
h1,h2,h3,.display{font-family:'Rajdhani',Arial,sans-serif;font-weight:700;letter-spacing:0.02em;}

/* ---------- overlays ---------- */
.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(0,224,164,0.08), transparent 55%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 26px),
    var(--bg);
  z-index:20;
  color:var(--text);
  padding:24px;
  text-align:center;
}
.overlay .eyebrow{
  color:var(--accent);
  font-family:'Rajdhani',Arial,sans-serif;
  font-weight:600;
  letter-spacing:0.35em;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:6px;
}
.overlay h2{
  font-size:52px;
  margin:0 0 26px 0;
  line-height:1;
}
.overlay h2 span{color:var(--accent);}

.menu-stack{display:flex;flex-direction:column;gap:10px;width:260px;}
.card-row{display:flex;flex-direction:column;gap:14px;width:290px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;}
label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--text-dim);
  font-family:'Rajdhani',Arial,sans-serif;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
}
input[type=number],input[type=text]{
  width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--text);font-family:'Inter';font-size:14px;text-align:right;
}
input[type=text]{width:140px;text-align:left;}
button{
  cursor:pointer;border:none;border-radius:10px;padding:13px 18px;
  font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:16px;letter-spacing:0.03em;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
button:active{transform:scale(0.96);}
button.primary{background:var(--accent);color:#04231a;border-color:var(--accent);}
button.primary:hover{background:#1af0b6;}
button.ghost:hover{border-color:var(--accent);color:var(--accent);}
button.danger{background:var(--danger);color:#2b0004;border-color:var(--danger);}

.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:340px;}
.track-card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:14px 10px;cursor:pointer;transition:border-color .15s, transform .08s;
}
.track-card:hover{border-color:var(--accent);}
.track-card:active{transform:scale(0.96);}
.track-card .tname{font-family:'Rajdhani';font-weight:700;font-size:16px;}
.track-card .tmeta{font-size:11px;color:var(--text-dim);margin-top:3px;}

/* ---------- HUD ---------- */
#hud{
  position:absolute;top:14px;left:14px;z-index:30;
  background:rgba(13,16,20,0.82);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  min-width:190px;max-width:250px;
  display:none;
  backdrop-filter:blur(6px);
}
#hud h4{margin:0 0 6px 0;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.15em;}
#rankList{font-size:13px;line-height:1.55;}
#rankList .me{color:var(--accent);font-weight:700;}
#lapInfo{margin-top:8px;font-size:12px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:8px;}

#mpLiveRank{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(13,16,20,0.82);border:1px solid var(--line);
  color:white;padding:10px 16px;border-radius:12px;font-size:12px;line-height:1.5;
  z-index:30;display:none;min-width:150px;text-align:left;backdrop-filter:blur(6px);
}

#exitRaceBtn{position:absolute;top:14px;right:14px;z-index:40;width:150px;display:none;}
#pauseBtn{position:absolute;top:14px;right:174px;z-index:40;width:90px;display:none;}

#useItemBtn{
  position:absolute;right:20px;bottom:170px;z-index:40;
  width:150px;padding:14px;background:var(--amber);color:#2b1c00;font-weight:700;font-size:15px;
  border:none;border-radius:14px;display:none;font-family:'Rajdhani';box-shadow:0 4px 14px rgba(255,179,0,0.25);
}

#zoomControls{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:40;}
#zoomControls button{width:52px;height:52px;font-size:24px;border-radius:50%;background:rgba(23,27,33,0.85);border:1px solid var(--line);padding:0;}

.pui{z-index:60;}
.joy-base{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid var(--line);touch-action:none;}
.joy-stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--accent);opacity:0.9;pointer-events:none;}

#toast{
  position:absolute;top:80px;left:50%;transform:translateX(-50%);
  background:rgba(23,27,33,0.9);border:1px solid var(--accent);color:var(--accent);
  padding:8px 16px;border-radius:20px;font-family:'Rajdhani';font-weight:700;letter-spacing:0.05em;
  z-index:60;display:none;font-size:14px;
}

#countdownEl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;color:white;z-index:60;font-family:'Rajdhani';font-weight:700;text-shadow:0 0 30px rgba(0,224,164,0.5);pointer-events:none;}

#finishBanner{
  position:absolute;inset:0;z-index:70;background:rgba(13,16,20,0.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;
}
#finishBanner h2{font-size:44px;margin:0 0 6px 0;color:var(--accent);}
#finishList{font-size:16px;line-height:1.8;margin:18px 0;min-width:260px;}
#finishList .p1{color:var(--yellow);font-weight:700;}

.hidden{display:none !important;}
.flex-col{display:flex;flex-direction:column;}
</style>
</head>
<body>

<!-- ================= MAIN MENU ================= -->
<div id="menu" class="overlay">
  <div class="eyebrow">Grid · Ready</div>
  <h2>Racing <span>Arena</span></h2>
  <div class="menu-stack">
    <button class="primary" onclick="openSinglePlayerSetup()">🏁 Einzelspieler</button>
    <button class="ghost" onclick="openMultiplayerLevelSelect()">🌐 Mehrspieler</button>
    <button class="ghost" onclick="toast('Einstellungen kommen bald')">⚙ Einstellungen</button>
  </div>
</div>

<!-- ================= SINGLEPLAYER SETUP ================= -->
<div id="spSetup" class="overlay hidden">
  <div class="eyebrow">Einzelspieler</div>
  <h2>Rennen <span>einrichten</span></h2>
  <div class="card-row">
    <label>Fahrername <input id="playerName" type="text" value="Player"></label>
    <label>Bots <input id="bots" type="number" value="6" min="0" max="11"></label>
    <label>Runden <input id="laps" type="number" value="5" min="1" max="20"></label>
  </div>
  <div class="eyebrow" style="margin-bottom:10px;">Strecke wählen</div>
  <div class="track-grid" id="spTrackGrid"></div>
  <div style="height:14px;"></div>
  <button class="primary" style="width:200px;" onclick="startRace()">▶ START</button>
  <button class="ghost" style="width:200px;margin-top:8px;" onclick="backToMenu()">⬅ Zurück</button>
</div>

<!-- ================= MULTIPLAYER: LEVEL SELECT ================= -->
<div id="mpLevelSelect" class="overlay hidden">
  <div class="eyebrow">Mehrspieler</div>
  <h2>Strecke <span>wählen</span></h2>
  <div class="track-grid" id="mpTrackGrid"></div>
  <div style="height:14px;"></div>
  <button class="ghost" style="width:200px;" onclick="backToMenu()">⬅ Zurück</button>
</div>

<!-- ================= MULTIPLAYER: SETUP ================= -->
<div id="mpSetup" class="overlay hidden">
  <div class="eyebrow">Mehrspieler</div>
  <h2>Rennen <span>einrichten</span></h2>
  <div class="card-row">
    <label>Spieler (1-4) <input id="mpPlayers" type="number" value="2" min="1" max="4"></label>
    <label>Bots <input id="mpBots" type="number" value="6" min="0" max="10"></label>
    <label>Runden <input id="mpLaps" type="number" value="5" min="1" max="20"></label>
  </div>
  <button class="primary" style="width:200px;" onclick="startMultiplayer()">▶ START</button>
  <button class="ghost" style="width:200px;margin-top:8px;" onclick="openMultiplayerLevelSelect()">⬅ Zurück</button>
</div>

<!-- ================= HUD ================= -->
<div id="hud">
  <h4>Live Ranking</h4>
  <div id="rankList"></div>
  <div id="lapInfo"></div>
</div>
<div id="mpLiveRank"></div>

<button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
<button id="exitRaceBtn" class="danger" onclick="requestExit()">❌ Verlassen</button>
<button id="useItemBtn" ontouchstart="usePlayerItemByIndex(0,event)" onmousedown="usePlayerItemByIndex(0,event)">🎁 Item: -</button>
<div id="zoomControls">
  <button onclick="zoomIn()">＋</button>
  <button onclick="zoomOut()">－</button>
</div>

<div id="toast"></div>
<div id="countdownEl" style="display:none;"></div>

<div id="finishBanner">
  <div class="eyebrow">Zieleinlauf</div>
  <h2>🏆 Rennen beendet</h2>
  <div id="finishList"></div>
  <div style="display:flex;gap:10px;">
    <button class="primary" onclick="rematch()">🔁 Nochmal</button>
    <button class="ghost" onclick="finishToMenu()">⬅ Hauptmenü</button>
  </div>
</div>

<canvas id="c"></canvas>

<script>
/* =========================================================================
   RACING ARENA ELITE — rewritten core
   ========================================================================= */

const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resizeCanvas(){
  c.width = innerWidth;
  c.height = innerHeight;
  buildTracks();
}
window.addEventListener("resize", resizeCanvas);

/* ---------------- TRACK DEFINITIONS ---------------- */
let TRACK_DEFS = [
  { name:"Sunset Loop",   diff:"Easy",   gen: simpleLoop },
  { name:"Serpentine",    diff:"Medium", gen: snakeTrack },
  { name:"Grand Circuit", diff:"Hard",   gen: longNarrow },
  { name:"Oval Sprint",   diff:"Easy",   gen: ovalTrack },
  { name:"Figure Eight",  diff:"Hard",   gen: figureEight },
  { name:"Zigzag Canyon", diff:"Medium", gen: zigzagTrack },
];

let tracks = [];
let track;
let currentTrackIndex = 0;
const trackWidth = 70;

function cxcy(){ return { cx: c.width/2, cy: c.height/2 }; }

function simpleLoop(){
  const {cx,cy}=cxcy(); const s=Math.min(c.width,c.height)/900;
  return [
    {x:cx+300*s,y:cy},
    {x:cx+200*s,y:cy-200*s},
    {x:cx-100*s,y:cy-220*s},
    {x:cx-300*s,y:cy-50*s},
    {x:cx-200*s,y:cy+200*s},
    {x:cx+100*s,y:cy+220*s}
  ];
}
function snakeTrack(){
  const {cx,cy}=cxcy(); const s=Math.min(c.width,c.height)/900;
  return [
    {x:cx-450*s,y:cy},
    {x:cx-250*s,y:cy-250*s},
    {x:cx,y:cy-100*s},
    {x:cx+250*s,y:cy-300*s},
    {x:cx+450*s,y:cy},
    {x:cx+200*s,y:cy+250*s},
    {x:cx-100*s,y:cy+150*s},
    {x:cx-350*s,y:cy+300*s}
  ];
}
function longNarrow(){
  const {cx,cy}=cxcy(); const s=Math.min(c.width,c.height)/1100;
  return [
    {x:cx-650*s,y:cy},
    {x:cx-500*s,y:cy-200*s},
    {x:cx-350*s,y:cy-350*s},
    {x:cx-200*s,y:cy-200*s},
    {x:cx-50*s,y:cy},
    {x:cx+100*s,y:cy+150*s},
    {x:cx+250*s,y:cy+300*s},
    {x:cx+400*s,y:cy+150*s},
    {x:cx+550*s,y:cy},
    {x:cx+450*s,y:cy-200*s},
    {x:cx+300*s,y:cy-350*s},
    {x:cx+150*s,y:cy-200*s},
    {x:cx,y:cy},
    {x:cx-150*s,y:cy+200*s},
    {x:cx-300*s,y:cy+350*s},
    {x:cx-450*s,y:cy+200*s}
  ];
}
function ovalTrack(){
  const {cx,cy}=cxcy(); const s=Math.min(c.width,c.height)/900;
  const pts=[]; const n=16; const rx=380*s, ry=220*s;
  for(let i=0;i<n;i++){
    let a=(i/n)*Math.PI*2;
    pts.push({x:cx+Math.cos(a)*rx, y:cy+Math.sin(a)*ry});
  }
  return pts;
}
function figureEight(){
  const {cx,cy}=cxcy(); const s=Math.min(c.width,c.height)/900;
  const pts=[]; const n=20; const r=230*s;
  for(let i=0;i<n;i++){
    let t=(i/n)*Math.PI*2;
    let x=r*Math.sin(t);
    let y=r*Math.sin(t)*Math.cos(t);
    pts.push({x:cx+x, y:cy+y*1.3});
  }
  return pts;
}
function zigzagTrack(){
  const {cx,cy}=cxcy(); const s=Math.min(c.width,c.height)/900;
  return [
    {x:cx-400*s,y:cy-150*s},
    {x:cx-200*s,y:cy+150*s},
    {x:cx,y:cy-150*s},
    {x:cx+200*s,y:cy+150*s},
    {x:cx+400*s,y:cy-150*s},
    {x:cx+400*s,y:cy+50*s},
    {x:cx+150*s,y:cy+280*s},
    {x:cx-150*s,y:cy+280*s},
    {x:cx-400*s,y:cy+50*s}
  ];
}
function buildTracks(){
  tracks = TRACK_DEFS.map(t=>t.gen());
  track = tracks[currentTrackIndex];
}

/* ---------------- track helpers ---------------- */
function project(px,py,a,b){
  let vx=b.x-a.x, vy=b.y-a.y;
  let wx=px-a.x, wy=py-a.y;
  let t=(wx*vx+wy*vy)/(vx*vx+vy*vy || 1);
  t=Math.max(0,Math.min(1,t));
  return {x:a.x+vx*t, y:a.y+vy*t};
}
function closest(x,y){
  let best=null, bd=Infinity;
  for(let i=0;i<track.length;i++){
    let a=track[i], b=track[(i+1)%track.length];
    let p=project(x,y,a,b);
    let d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=p;}
  }
  return best;
}
// curvature at a checkpoint index: smaller = sharper turn (used for bot braking)
function curvatureAt(i){
  let a=track[(i-1+track.length)%track.length];
  let b=track[i];
  let cpt=track[(i+1)%track.length];
  let v1x=b.x-a.x, v1y=b.y-a.y;
  let v2x=cpt.x-b.x, v2y=cpt.y-b.y;
  let a1=Math.atan2(v1y,v1x), a2=Math.atan2(v2y,v2x);
  let diff=Math.atan2(Math.sin(a2-a1),Math.cos(a2-a1));
  return Math.abs(diff); // 0 = straight, ~pi = hairpin
}

/* ---------------- global state ---------------- */
let cars=[], bananas=[], rockets=[], explosionsFx=[], items=[];
let maxLaps=5, running=false, paused=false, gameMode="sp", playerCount=1;
let playerInputs=[], playerControls=[];
let cameraZoom=1;
const minZoom=0.55, maxZoom=1.8;
const botTypes=["weak","middle","hard"];
let raceStartTime=0;

const menu=document.getElementById("menu");

function toast(msg,ms=1800){
  const t=document.getElementById("toast");
  t.innerText=msg; t.style.display="block";
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.style.display="none",ms);
}

/* ================= CAR ================= */
class Car{
  constructor(id,name,skill=0.7,type="middle"){
    this.id=id; this.name=name; this.skill=skill; this.type=type;
    if(type==="boss"){ this.skill=1; }
    let a=track[0], b=track[1];
    this.angle=Math.atan2(b.y-a.y,b.x-a.x);
    this.x=a.x; this.y=a.y;
    this.cp=1; this.lap=0;
    this.baseSpeed = type==="boss" ? 4.7 : 3.1 + skill*1.1;
    this.speed=0; this.targetSpeed=this.baseSpeed;
    this.boostTimer=0; this.spin=0;
    this.color=`hsl(${(id*63)%360},78%,58%)`;
    this.finished=false; this.finishTime=0; this.rank=0;
    this.isPlayer=false;
    this.item=null;
    this.progress=0;
    this.mistakeCooldown=0;
    this.itemCooldown=60+Math.random()*120;
    this.trail=[];
  }

  aiStyleOffset(){
    const t=Date.now();
    if(this.type==="weak")   return Math.sin(t*0.0035+this.id)*95;
    if(this.type==="middle") return Math.sin(t*0.0026+this.id)*60;
    if(this.type==="hard")   return Math.sin(t*0.002+this.id)*32;
    if(this.type==="boss")   return Math.sin(t*0.0009+this.id)*8;
    return 0;
  }

  useItemAI(){
    if(!this.item || this.itemCooldown>0) return;
    // find rival ahead within range (for offense) and behind (for defense)
    let rivalAheadClose = cars.some(o=>o!==this && !o.finished &&
      Math.hypot(o.x-this.x,o.y-this.y) < 170 &&
      Math.hypot(o.x-this.x,o.y-this.y) > 20);
    let leading = cars.every(o=>o===this || o.progress<=this.progress);

    let used=false;
    if(this.item==="boost"){
      this.boostTimer=60; used=true;
    } else if(this.item==="spin"){
      if(rivalAheadClose){
        cars.forEach(o=>{ if(o!==this && Math.hypot(o.x-this.x,o.y-this.y)<170) o.spin=Math.max(o.spin,1); });
        used=true;
      }
    } else if(this.item==="banana"){
      if(leading || Math.random()<0.02){
        let bx=this.x-Math.cos(this.angle)*26, by=this.y-Math.sin(this.angle)*26;
        bananas.push(new Banana(bx,by));
        used=true;
      }
    } else if(this.item==="rocket"){
      if(rivalAheadClose || Math.random()<0.01){
        rockets.push(new Rocket(this));
        used=true;
      }
    } else if(this.item==="explosion"){
      let anyNear = cars.some(o=>o!==this && Math.hypot(o.x-this.x,o.y-this.y)<260);
      if(anyNear){
        cars.forEach(o=>{ if(o!==this && Math.hypot(o.x-this.x,o.y-this.y)<260) o.spin=Math.max(o.spin,1.3); });
        explosionsFx.push(new Explosion(this.x,this.y));
        used=true;
      }
    }
    if(used){ this.item=null; this.itemCooldown=90+Math.random()*90; if(this.isPlayer) updateItemUI(this.id); }
  }

  update(dt){
    if(this.finished) return;
    if(this.itemCooldown>0) this.itemCooldown--;

    if(this.spin>0){
      this.angle += 0.28;
      this.speed *= 0.62;
      this.spin -= 0.022;
    }

    if(this.isPlayer){
      const input = playerInputs[this.id];
      if(input){
        let dx=input.x-this.x, dy=input.y-this.y;
        let angle=Math.atan2(dy,dx);
        let diff=Math.atan2(Math.sin(angle-this.angle),Math.cos(angle-this.angle));
        this.angle += diff*0.14;
      }
      let base=this.baseSpeed;
      if(this.boostTimer>0){ base=this.baseSpeed+2.6; this.boostTimer--; }
      this.speed = this.spin>0 ? base*0.4 : base;
    } else {
      // ---- HUMAN-LIKE BOT AI ----
      const next=track[this.cp];
      const after=track[(this.cp+1)%track.length];
      let dirX=after.x-next.x, dirY=after.y-next.y;
      let len=Math.hypot(dirX,dirY)||1; dirX/=len; dirY/=len;
      let sideX=-dirY, sideY=dirX;
      let offset=this.aiStyleOffset();

      // occasional small human error, more likely for weaker bots, fades over race distance (they "warm up")
      if(this.mistakeCooldown>0) this.mistakeCooldown--;
      if(this.mistakeCooldown<=0 && Math.random()<(1-this.skill)*0.0035){
        this.spin = Math.max(this.spin, 0.5);
        this.mistakeCooldown = 90;
      }

      let target={
        x: next.x*0.7 + after.x*0.3 + sideX*offset,
        y: next.y*0.7 + after.y*0.3 + sideY*offset
      };

      // avoid slower cars ahead (overtake behaviour)
      cars.forEach(o=>{
        if(o===this) return;
        let d=Math.hypot(o.x-this.x,o.y-this.y);
        if(d<65 && o.speed<this.speed){
          target.x += (this.x-o.x)*0.22;
          target.y += (this.y-o.y)*0.22;
        }
      });

      let dx=target.x-this.x, dy=target.y-this.y;
      let ang=Math.atan2(dy,dx);
      let turnSpeed=0.05+this.skill*0.1;
      let diff=Math.atan2(Math.sin(ang-this.angle),Math.cos(ang-this.angle));
      this.angle += diff*turnSpeed;

      // braking before sharp corners (curvature-based), scaled by skill (better drivers brake later/less)
      let curve = curvatureAt(this.cp);
      let cornerFactor = 1 - Math.min(0.55, (curve/Math.PI) * (1.15 - this.skill*0.6));
      let base = this.baseSpeed * cornerFactor;

      // rubber-band: bots slightly behind get a small speed nudge, bots far ahead ease off - keeps races close
      let avgProgress = cars.reduce((s,o)=>s+o.progress,0)/cars.length;
      let rubberBand = (avgProgress - this.progress) > 0 ? 0.15 : -0.05;
      base += Math.max(-0.3, Math.min(0.35, rubberBand*0.002 * (avgProgress-this.progress)));

      if(this.boostTimer>0){ base = this.baseSpeed+2.6; this.boostTimer--; }
      this.speed = this.spin>0 ? base*0.4 : Math.max(1.2, base);

      this.useItemAI();
    }

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    // keep on track
    let center=closest(this.x,this.y);
    let d=Math.hypot(center.x-this.x, center.y-this.y);
    if(d>trackWidth){
      this.x += (center.x-this.x)*0.09;
      this.y += (center.y-this.y)*0.09;
      this.speed *= 0.9;
    }

    // checkpoint progress
    let tgt=track[this.cp];
    let dist=Math.hypot(tgt.x-this.x, tgt.y-this.y);
    if(dist<90){
      this.cp++;
      if(this.cp>=track.length){
        this.cp=0; this.lap++;
        if(this.lap>=maxLaps){
          this.finished=true;
          this.finishTime=performance.now();
        }
      }
    }

    // car-car collision (skip for player-driving smoothness overshoot)
    cars.forEach(o=>{
      if(o===this) return;
      let dd=Math.hypot(o.x-this.x,o.y-this.y);
      if(dd<22){
        let push=(22-dd)/2;
        let nx=(this.x-o.x)/(dd||1), ny=(this.y-o.y)/(dd||1);
        this.x+=nx*push; this.y+=ny*push;
        o.x-=nx*push; o.y-=ny*push;
        this.speed*=0.92;
      }
    });

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>10) this.trail.shift();
  }

  draw(){
    // motion trail
    ctx.save();
    ctx.globalAlpha=0.25;
    for(let i=0;i<this.trail.length;i++){
      let p=this.trail[i];
      ctx.fillStyle=this.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,3*(i/this.trail.length),0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);
    ctx.fillStyle="rgba(255,255,255,0.55)";
    ctx.fillRect(6,-6,3,12);
    ctx.restore();

    ctx.fillStyle="white";
    ctx.font="12px Rajdhani, Arial";
    ctx.textAlign="center";
    let lvl = {weak:"LVL 1",middle:"LVL 2",hard:"LVL 3",boss:"BOSS"}[this.type] || "";
    ctx.fillText(`${this.name}${lvl?" ("+lvl+")":""}`, this.x, this.y-15);
  }
}

/* ================= ITEMS / PROJECTILES ================= */
class ItemBox{
  constructor(x,y){ this.x=x; this.y=y; this.active=true; this.respawn=0; }
  update(){ if(!this.active){ this.respawn--; if(this.respawn<=0) this.active=true; } }
  draw(){
    if(!this.active) return;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.fillStyle="gold";
    ctx.fillRect(-12,-12,24,24);
    ctx.strokeStyle="white";
    ctx.strokeRect(-12,-12,24,24);
    ctx.restore();
  }
  check(car){
    if(!this.active) return;
    let d=Math.hypot(car.x-this.x,car.y-this.y);
    if(d<25){ this.active=false; this.respawn=300; giveItem(car); }
  }
}
function giveItem(car){
  const pool=["boost","spin","banana","rocket","explosion"];
  car.item = pool[Math.floor(Math.random()*pool.length)];
  car.itemCooldown = 20;
  if(car.isPlayer) updateItemUI(car.id);
}
class Banana{
  constructor(x,y){ this.x=x; this.y=y; this.active=true; this.life=600; }
  update(){ this.life--; if(this.life<=0) this.active=false; }
  draw(){
    if(!this.active) return;
    ctx.fillStyle="#ffe066";
    ctx.beginPath(); ctx.arc(this.x,this.y,8,0,Math.PI*2); ctx.fill();
  }
  check(car){
    let d=Math.hypot(car.x-this.x,car.y-this.y);
    if(d<18){ car.spin=Math.max(car.spin,1); this.active=false; return true; }
    return false;
  }
}
class Rocket{
  constructor(owner){ this.x=owner.x; this.y=owner.y; this.angle=owner.angle; this.owner=owner; this.dead=false; }
  update(){
    this.x += Math.cos(this.angle)*8;
    this.y += Math.sin(this.angle)*8;
    cars.forEach(c=>{
      if(c===this.owner) return;
      let d=Math.hypot(c.x-this.x,c.y-this.y);
      if(d<20){
        c.spin=Math.max(c.spin,1.5);
        explosionsFx.push(new Explosion(this.x,this.y));
        this.dead=true;
      }
    });
  }
  draw(){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    ctx.fillStyle="#ff4d4d"; ctx.fillRect(-10,-4,20,8);
    ctx.restore();
  }
}
class Explosion{
  constructor(x,y){ this.x=x; this.y=y; this.life=30; }
  update(){ this.life--; }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,40-this.life,0,Math.PI*2);
    ctx.strokeStyle="orange"; ctx.lineWidth=4; ctx.stroke();
  }
}

/* ================= INPUT (unified pointer system) ================= */
// single-player: drag anywhere on canvas to steer toward finger/mouse
let spPointerId=null;
c.addEventListener("pointerdown", e=>{
  if(gameMode!=="sp" || !running || paused) return;
  spPointerId=e.pointerId;
  setSPTarget(e);
});
c.addEventListener("pointermove", e=>{
  if(gameMode!=="sp" || spPointerId===null || e.pointerId!==spPointerId) return;
  setSPTarget(e);
});
window.addEventListener("pointerup", e=>{ if(e.pointerId===spPointerId) spPointerId=null; });
function setSPTarget(e){
  let worldX=(e.clientX-c.width/2)/cameraZoom + c.width/2;
  let worldY=(e.clientY-c.height/2)/cameraZoom + c.height/2;
  playerInputs[0]={x:worldX,y:worldY};
}

/* multiplayer virtual joysticks are created in createPlayerUI() using pointer events */

/* ================= MENU NAVIGATION ================= */
function showOverlay(id){
  ["menu","spSetup","mpLevelSelect","mpSetup"].forEach(k=>{
    document.getElementById(k).classList.toggle("hidden", k!==id);
  });
}
function backToMenu(){ showOverlay("menu"); }

function trackCardsHtml(onclickFn){
  return TRACK_DEFS.map((t,i)=>`
    <div class="track-card" onclick="${onclickFn}(${i})">
      <div class="tname">${t.name}</div>
      <div class="tmeta">${t.diff} · Strecke ${i+1}</div>
    </div>`).join("");
}
function openSinglePlayerSetup(){
  document.getElementById("spTrackGrid").innerHTML = trackCardsHtml("selectSPTrack");
  showOverlay("spSetup");
}
function selectSPTrack(i){
  currentTrackIndex=i; track=tracks[i];
  document.querySelectorAll("#spTrackGrid .track-card").forEach((el,idx)=>{
    el.style.borderColor = idx===i ? "var(--accent)" : "var(--line)";
  });
}
function openMultiplayerLevelSelect(){
  document.getElementById("mpTrackGrid").innerHTML = trackCardsHtml("selectMPTrack");
  showOverlay("mpLevelSelect");
}
function selectMPTrack(i){
  currentTrackIndex=i; track=tracks[i];
  showOverlay("mpSetup");
}

/* ================= RACE SETUP ================= */
function resetWorld(){
  cars=[]; bananas=[]; rockets=[]; explosionsFx=[]; items=[];
  playerInputs=[]; playerControls=[];
  cameraZoom=1;
  paused=false;
}

function spawnItems(){
  items=[];
  for(let i=0;i<8;i++){
    let p=track[Math.floor(Math.random()*track.length)];
    items.push(new ItemBox(p.x+(Math.random()-0.5)*120, p.y+(Math.random()-0.5)*120));
  }
}

function startRace(){
  resetWorld();
  gameMode="sp"; playerCount=1;
  playerInputs[0]={x:0,y:0};

  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;
  let name=document.getElementById("playerName").value || "Player";

  let player=new Car(0,name,0.7); player.isPlayer=true;
  cars.push(player);

  for(let i=1;i<=n;i++){
    if(i===n && n>=1){
      cars.push(new Car(i,"BOSS",1,"boss"));
    } else {
      let type=botTypes[Math.floor(Math.random()*botTypes.length)];
      cars.push(new Car(i,"Bot "+i,0.55+Math.random()*0.25,type));
    }
  }
  spawnItems();

  document.getElementById("hud").style.display="block";
  document.getElementById("mpLiveRank").style.display="none";
  document.getElementById("exitRaceBtn").style.display="block";
  document.getElementById("pauseBtn").style.display="block";
  document.getElementById("useItemBtn").style.display="block";
  document.getElementById("useItemBtn").innerText="🎁 Item: -";

  showOverlay(null);
  running=false;
  countdown(()=>{ running=true; raceStartTime=performance.now(); });
}

function startMultiplayer(){
  resetWorld();
  gameMode="mp";
  playerCount=+document.getElementById("mpPlayers").value;
  let bots=+document.getElementById("mpBots").value;
  maxLaps=+document.getElementById("mpLaps").value;

  for(let i=0;i<playerCount;i++){
    let p=new Car(i,"P"+(i+1),0.7); p.isPlayer=true;
    cars.push(p);
  }
  for(let i=0;i<bots;i++){
    let type=botTypes[Math.floor(Math.random()*botTypes.length)];
    cars.push(new Car(i+playerCount,"Bot "+(i+1),0.55+Math.random()*0.25,type));
  }
  spawnItems();
  createPlayerUI();

  document.getElementById("hud").style.display="none";
  document.getElementById("mpLiveRank").style.display="block";
  document.getElementById("exitRaceBtn").style.display="block";
  document.getElementById("pauseBtn").style.display="block";
  document.getElementById("useItemBtn").style.display="none";

  showOverlay(null);
  running=false;
  countdown(()=>{ running=true; raceStartTime=performance.now(); });
}

function requestExit(){ endRace(true); }
function endRace(toMenu){
  running=false; paused=false;
  document.querySelectorAll(".pui").forEach(e=>e.remove());
  document.getElementById("hud").style.display="none";
  document.getElementById("mpLiveRank").style.display="none";
  document.getElementById("exitRaceBtn").style.display="none";
  document.getElementById("pauseBtn").style.display="none";
  document.getElementById("useItemBtn").style.display="none";
  document.getElementById("finishBanner").style.display="none";
  resetWorld();
  if(toMenu) backToMenu();
}
function togglePause(){
  if(!running && !paused) return;
  paused=!paused;
  document.getElementById("pauseBtn").innerText = paused ? "▶ Weiter" : "⏸ Pause";
  toast(paused ? "Pausiert" : "Weiter geht's!");
}

/* ================= COUNTDOWN ================= */
function countdown(cb){
  const el=document.getElementById("countdownEl");
  el.style.display="block";
  let n=3;
  const int=setInterval(()=>{
    if(n===0){
      el.innerText="GO!";
      setTimeout(()=>{ el.style.display="none"; clearInterval(int); cb(); },700);
      return;
    }
    el.innerText=n; n--;
  },900);
}

/* ================= ITEM USE (unified for sp + mp) ================= */
function usePlayerItemByIndex(i,e){
  if(e) e.preventDefault();
  let player=cars[i];
  if(!player || !player.item) return;

  if(player.item==="boost"){ player.boostTimer=60; }
  else if(player.item==="spin"){
    cars.forEach(o=>{ if(o!==player && Math.hypot(o.x-player.x,o.y-player.y)<120) o.spin=1; });
  } else if(player.item==="banana"){
    let bx=player.x-Math.cos(player.angle)*26, by=player.y-Math.sin(player.angle)*26;
    bananas.push(new Banana(bx,by));
  } else if(player.item==="rocket"){
    rockets.push(new Rocket(player));
  } else if(player.item==="explosion"){
    cars.forEach(o=>{ if(o!==player && Math.hypot(o.x-player.x,o.y-player.y)<260) o.spin=Math.max(o.spin,1.3); });
    explosionsFx.push(new Explosion(player.x,player.y));
  }
  player.item=null;
  updateItemUI(i);
}
function updateItemUI(i){
  const player=cars[i];
  if(gameMode==="sp" && i===0){
    const btn=document.getElementById("useItemBtn");
    btn.innerText = player && player.item ? "🎁 "+player.item.toUpperCase() : "🎁 Item: -";
    return;
  }
  const ctrl=playerControls[i];
  if(!ctrl) return;
  ctrl.btn.innerText = player && player.item ? "🎁 "+player.item.toUpperCase() : "🎁 ITEM";
}

/* ================= MULTIPLAYER TOUCH UI ================= */
function createPlayerUI(){
  document.querySelectorAll(".pui").forEach(e=>e.remove());
  playerControls=[];

  for(let i=0;i<playerCount;i++){
    const joy=document.createElement("div");
    joy.className="pui joy-base";
    const isTop = i>=2;
    joy.style.bottom = isTop ? "auto" : "40px";
    joy.style.top = isTop ? "20px" : "auto";
    joy.style.left = (i%2===0) ? "20px" : "auto";
    joy.style.right = (i%2===1) ? "20px" : "auto";

    const stick=document.createElement("div");
    stick.className="joy-stick";
    joy.appendChild(stick);
    document.body.appendChild(joy);

    let touchId=null;
    joy.addEventListener("pointerdown", e=>{
      e.preventDefault(); joy.setPointerCapture(e.pointerId); touchId=e.pointerId;
      updateJoystick(i, joy, stick, e);
    });
    joy.addEventListener("pointermove", e=>{
      if(e.pointerId!==touchId) return;
      updateJoystick(i, joy, stick, e);
    });
    joy.addEventListener("pointerup", e=>{
      if(e.pointerId!==touchId) return;
      touchId=null; stick.style.transform="translate(-50%,-50%)";
    });

    const btn=document.createElement("button");
    btn.className="pui"; btn.innerText="🎁 ITEM";
    btn.style.position="absolute";
    btn.style.width="120px"; btn.style.height="46px"; btn.style.fontSize="13px";
    btn.style.borderRadius="12px"; btn.style.zIndex=60;
    btn.style.left = (i%2===0) ? "20px" : "auto";
    btn.style.right = (i%2===1) ? "20px" : "auto";
    btn.style.bottom = isTop ? "auto" : "170px";
    btn.style.top = isTop ? "170px" : "auto";
    document.body.appendChild(btn);
    btn.addEventListener("pointerdown", e=>{ e.preventDefault(); usePlayerItemByIndex(i,e); });

    playerControls.push({joy,stick,btn});
  }
}
function updateJoystick(i, joy, stick, e){
  const rect=joy.getBoundingClientRect();
  let dx=e.clientX-(rect.left+rect.width/2);
  let dy=e.clientY-(rect.top+rect.height/2);
  const max=40;
  const len=Math.hypot(dx,dy);
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const player=cars[i];
  if(player) playerInputs[i]={x:player.x+dx*6, y:player.y+dy*6};
}

/* ================= ZOOM ================= */
function zoomIn(){ cameraZoom=Math.min(maxZoom, cameraZoom+0.1); }
function zoomOut(){ cameraZoom=Math.max(minZoom, cameraZoom-0.1); }

/* ================= DRAW TRACK ================= */
function drawTrack(){
  ctx.strokeStyle="#3a4049"; ctx.lineWidth=trackWidth*2;
  ctx.beginPath(); ctx.moveTo(track[0].x,track[0].y);
  for(const p of track) ctx.lineTo(p.x,p.y);
  ctx.closePath(); ctx.stroke();

  ctx.strokeStyle="rgba(255,255,255,0.55)"; ctx.lineWidth=2;
  ctx.setLineDash([10,10]); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle="#ffe066"; ctx.lineWidth=4;
  for(let i=0;i<track.length;i++){
    const a=track[i], b=track[(i+1)%track.length];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    let dx=b.x-a.x, dy=b.y-a.y;
    const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
    const nx=-dy, ny=dx, size=80;
    ctx.beginPath();
    ctx.moveTo(mx-nx*size,my-ny*size);
    ctx.lineTo(mx+nx*size,my+ny*size);
    ctx.stroke();
  }
}

/* ================= SCORE / HUD ================= */
function updateHud(){
  cars.forEach(c=>{
    if(c.finished) return;
    const target=track[c.cp];
    const dist=Math.hypot(target.x-c.x,target.y-c.y);
    c.progress = c.lap*100000 + c.cp*1000 - dist;
  });

  const sorted=[...cars].sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.progress-a.progress;
  });
  sorted.forEach((c,i)=>c.rank=i+1);

  if(gameMode==="sp"){
    const me=cars.find(c=>c.isPlayer);
    let html="";
    sorted.slice(0,8).forEach(c=>{
      html += `<div class="${c.isPlayer?'me':''}">${c.rank}. ${c.name}</div>`;
    });
    document.getElementById("rankList").innerHTML=html;
    document.getElementById("lapInfo").innerText = me ? `Runde ${Math.min(me.lap+1,maxLaps)} / ${maxLaps}` : "";
  } else {
    let html="<b>🏁 TOP 10</b><br>";
    sorted.slice(0,10).forEach(c=>{ html+=`${c.rank}. ${c.name}<br>`; });
    document.getElementById("mpLiveRank").innerHTML=html;
  }

  if(running && cars.every(c=>c.finished)){
    running=false;
    showFinishBanner(sorted);
  }
}

function showFinishBanner(sorted){
  const el=document.getElementById("finishBanner");
  let html="";
  sorted.forEach((c,i)=>{
    html += `<div class="${i===0?'p1':''}">${i+1}. ${c.name}</div>`;
  });
  document.getElementById("finishList").innerHTML=html;
  el.style.display="flex";
}
function rematch(){
  document.getElementById("finishBanner").style.display="none";
  if(gameMode==="sp") startRace(); else startMultiplayer();
}
function finishToMenu(){ endRace(true); }

/* ================= MAIN LOOP ================= */
function loop(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();
  ctx.translate(c.width/2,c.height/2);
  ctx.scale(cameraZoom,cameraZoom);
  ctx.translate(-c.width/2,-c.height/2);

  if(track) drawTrack();

  if(!paused){
    bananas.forEach(b=>b.update());
    bananas=bananas.filter(b=>b.active);
    rockets.forEach(r=>r.update());
    rockets=rockets.filter(r=>!r.dead);
    explosionsFx.forEach(e=>e.update());
    explosionsFx=explosionsFx.filter(e=>e.life>0);
    items.forEach(i=>i.update());
  }

  bananas.forEach(b=>b.draw());
  rockets.forEach(r=>r.draw());
  explosionsFx.forEach(e=>e.draw());
  items.forEach(i=>i.draw());

  cars.forEach(car=>{
    if(!paused){
      if(running) car.update();
      bananas.forEach(b=>b.check(car));
      items.forEach(i=>i.check(car));
    }
    car.draw();
  });

  if(cars.length) updateHud();

  ctx.restore();
  requestAnimationFrame(loop);
}

/* ================= INIT ================= */
resizeCanvas();
loop();
</script>
