<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena Fixed</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}

#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:260px;color:white;
}

input,button{
width:100%;
margin-top:6px;
padding:8px;
border:none;
border-radius:6px;
}

button{background:#00c27a;color:white;font-weight:bold;}

#score{margin-top:10px;font-size:13px;}

/* STEERING WHEEL */
#wheel{
width:120px;
height:120px;
margin:10px auto;
border-radius:50%;
border:3px solid white;
position:relative;
touch-action:none;
}

#needle{
position:absolute;
width:4px;
height:50px;
background:red;
top:10px;
left:50%;
transform-origin:bottom center;
transform:rotate(0rad);
}
</style>
</head>

<body>

<div id="ui">
<h3>🏁 Racing Arena</h3>

Dein Name:
<input id="playerName" value="Player">

Bots:
<input id="bots" type="number" value="6">

Runden:
<input id="laps" type="number" value="5">

<button onclick="start()">START</button>

<div id="wheel">
  <div id="needle"></div>
</div>

<div id="score"></div>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

// ================= TRACK =================
const track=[
  {x:cx+300,y:cy},
  {x:cx+200,y:cy-200},
  {x:cx-100,y:cy-220},
  {x:cx-300,y:cy-50},
  {x:cx-200,y:cy+200},
  {x:cx+100,y:cy+220}
];

const trackWidth=70;

// ================= STEERING (iPad FIX) =================
let steerAngle=0;
let steerPower=0;

const wheel=document.getElementById("wheel");
const needle=document.getElementById("needle");

let dragging=false;

function getPos(e){
  let r=wheel.getBoundingClientRect();

  let x,y;

  if(e.touches){
    x=e.touches[0].clientX-(r.left+60);
    y=e.touches[0].clientY-(r.top+60);
  } else {
    x=e.clientX-(r.left+60);
    y=e.clientY-(r.top+60);
  }

  return {x,y};
}

function updateSteer(e){
  let p=getPos(e);

  steerAngle=Math.atan2(p.y,p.x);
  steerPower=Math.min(1,Math.hypot(p.x,p.y)/60);

  needle.style.transform=`rotate(${steerAngle}rad)`;
}

// Mouse
wheel.addEventListener("mousedown",()=>dragging=true);
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",(e)=>{
  if(!dragging) return;
  updateSteer(e);
});

// Touch (iPad FIX)
wheel.addEventListener("touchstart",(e)=>{
  dragging=true;
  updateSteer(e);
});

wheel.addEventListener("touchmove",(e)=>{
  if(!dragging) return;
  updateSteer(e);
});

wheel.addEventListener("touchend",()=>{
  dragging=false;
});

// ================= CAR =================
class Car{
  constructor(i,name,isPlayer=false){

    this.name=name;
    this.isPlayer=isPlayer;

    this.x=track[0].x;
    this.y=track[0].y;

    this.cp=1;
    this.lap=0;

    this.angle=0;

    this.speed=2;
    this.targetSpeed=2;

    this.color=isPlayer?"white":`hsl(${i*50},80%,60%)`;

    this.finished=false;

    setInterval(()=>{
      if(!this.isPlayer){
        this.targetSpeed=1+Math.random()*3;
      }
    },1000);
  }

  update(){

    if(this.finished) return;

    let t=track[this.cp];

    let dx=t.x-this.x;
    let dy=t.y-this.y;

    let dist=Math.hypot(dx,dy);

    let ang=Math.atan2(dy,dx);

    // ================= PLAYER CONTROL =================
    if(this.isPlayer){
      this.angle += (steerAngle-this.angle)*0.2;
      this.speed = 1 + steerPower*4;
    } else {
      this.angle += (ang-this.angle)*0.12;
      this.speed += (this.targetSpeed-this.speed)*0.05;
    }

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    // Track Begrenzung
    let center=closest(this.x,this.y);
    let d=Math.hypot(center.x-this.x,center.y-this.y);

    if(d>trackWidth){
      this.x+=(center.x-this.x)*0.08;
      this.y+=(center.y-this.y)*0.08;
      this.speed*=0.9;
    }

    // Checkpoint
    if(dist<50){
      this.cp++;
      if(this.cp>=track.length){
        this.cp=0;
        this.lap++;
        if(this.lap>=maxLaps)this.finished=true;
      }
    }
  }

  draw(){

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);

    ctx.restore();

    // NAME
    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    ctx.fillText(this.name,this.x,this.y-15);
  }
}

// ================= HELP =================
function closest(x,y){

  let best=null;
  let bd=99999;

  for(let i=0;i<track.length;i++){

    let a=track[i];
    let b=track[(i+1)%track.length];

    let vx=b.x-a.x;
    let vy=b.y-a.y;

    let wx=x-a.x;
    let wy=y-a.y;

    let t=(wx*vx+wy*vy)/(vx*vx+vy*vy);

    t=Math.max(0,Math.min(1,t));

    let px=a.x+vx*t;
    let py=a.y+vy*t;

    let d=Math.hypot(px-x,py-y);

    if(d<bd){
      bd=d;
      best={x:px,y:py};
    }
  }

  return best;
}

// ================= GAME =================
let cars=[];
let maxLaps=5;
let running=false;

function start(){

  cars=[];

  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;

  let name=document.getElementById("playerName").value;

  // PLAYER
  cars.push(new Car(999,name,true));

  // BOTS
  for(let i=0;i<n;i++){
    cars.push(new Car(i,"Bot "+(i+1)));
  }

  running=true;
}

// ================= TRACK =================
function drawTrack(){

  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);

  for(let p of track){
    ctx.lineTo(p.x,p.y);
  }

  ctx.closePath();
  ctx.stroke();
}

// ================= SCORE =================
function score(){

  let sorted=[...cars].sort((a,b)=>b.lap-a.lap);

  let html="<h3>🏆 Ranking</h3>";

  sorted.forEach((c,i)=>{
    html+=`${i+1}. ${c.name} | Lap ${c.lap}<br>`;
  });

  document.getElementById("score").innerHTML=html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  drawTrack();

  let done=true;

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
    if(!c.finished)done=false;
  });

  score();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
