<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena FIX</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}
#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:240px;color:white;
}
input,button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:6px;}
button{background:#00c27a;color:white;font-weight:bold;}
#score{margin-top:10px;font-size:13px;}
</style>
</head>

<body>

<div id="ui">
<h3>🏁 Racing</h3>
Bots:
<input id="bots" type="number" value="5">
Runden:
<input id="laps" type="number" value="3">
<button onclick="start()">START</button>
<div id="score"></div>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

// ================= TRACK =================
const track=[
  {x:cx+250,y:cy},
  {x:cx+150,y:cy-180},
  {x:cx-150,y:cy-180},
  {x:cx-250,y:cy},
  {x:cx-150,y:cy+180},
  {x:cx+150,y:cy+180}
];

const trackWidth=70;

// ================= CAR =================
class Car{

  constructor(i,name){

    this.name=name;

    this.x=track[0].x;
    this.y=track[0].y;

    this.cp=1;
    this.lap=0;

    this.angle=0;

    this.speed=2;
    this.targetSpeed=2;

    this.color=`hsl(${i*60},80%,60%)`;

    this.finished=false;

    setInterval(()=>{
      this.targetSpeed=1+Math.random()*3;
    },1000);
  }

  update(){

    if(this.finished) return;

    this.speed += (this.targetSpeed-this.speed)*0.05;

    let t=track[this.cp];

    let dx=t.x-this.x;
    let dy=t.y-this.y;

    let dist=Math.hypot(dx,dy);

    let ang=Math.atan2(dy,dx);

    this.angle += (ang-this.angle)*0.1;

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    // checkpoint fix
    if(dist<45){
      this.cp++;

      if(this.cp>=track.length){
        this.cp=0;
        this.lap++;
      }
    }
  }

  draw(){

    // AUTO
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);

    ctx.fillStyle="#111";
    ctx.fillRect(-4,-3,8,6);

    ctx.restore();

    // NAME (WICHTIG FIX: außerhalb transform)
    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";

    ctx.fillText(this.name,this.x,this.y-18);
  }
}

// ================= GAME =================
let cars=[];
let running=false;
let maxLaps=3;

function start(){

  cars=[];

  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;

  for(let i=0;i<n;i++){
    cars.push(new Car(i,"Bot "+(i+1)));
  }

  running=true;
}

// ================= DRAW TRACK =================
function drawTrack(){

  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);

  for(let p of track){
    ctx.lineTo(p.x,p.y);
  }

  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.setLineDash([10,10]);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ================= SCORE =================
function score(){

  let html="<h3>🏆</h3>";

  cars
  .sort((a,b)=>b.lap-a.lap)
  .forEach((c,i)=>{
    html+=`${i+1}. ${c.name} | Lap ${c.lap}<br>`;
  });

  document.getElementById("score").innerHTML=html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  drawTrack();

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
  });

  score();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
