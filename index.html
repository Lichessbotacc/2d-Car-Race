
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena Fixed</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}

#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:260px;color:white;
}

input,button{
width:100%;margin-top:6px;padding:8px;
border:none;border-radius:6px;
}

button{background:#00c27a;color:white;font-weight:bold;}

#score{margin-top:10px;font-size:13px;}

/* LENKRAD */
#wheel{
position:absolute;
right:40px;
bottom:40px;
width:140px;
height:140px;
border-radius:50%;
border:4px solid white;
opacity:0.7;
touch-action:none;
}

#indicator{
position:absolute;
left:50%;
top:50%;
width:6px;
height:40px;
background:red;
transform-origin:bottom center;
transform:translate(-50%,-100%);
border-radius:3px;
}
</style>
</head>

<body>

<div id="ui">
<h3>🏁 Racing Arena</h3>

Bots:
<input id="bots" type="number" value="6">

Runden:
<input id="laps" type="number" value="5">

<button onclick="start()">START</button>

<div id="score"></div>
</div>

<div id="wheel">
  <div id="indicator"></div>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

// ================= TRACK =================
const track=[
  {x:cx+300,y:cy},
  {x:cx+200,y:cy-200},
  {x:cx-100,y:cy-220},
  {x:cx-300,y:cy-50},
  {x:cx-200,y:cy+200},
  {x:cx+100,y:cy+220}
];

const trackWidth=70;

// ================= LENKRAD =================
let steer=0;
let dragging=false;

const wheel=document.getElementById("wheel");
const indicator=document.getElementById("indicator");

wheel.addEventListener("pointerdown",(e)=>{
  dragging=true;
  wheel.setPointerCapture(e.pointerId);
  updateSteer(e);
});

wheel.addEventListener("pointerup",()=>{
  dragging=false;
  steer*=0.2;
});

wheel.addEventListener("pointermove",(e)=>{
  if(!dragging) return;
  updateSteer(e);
});

function updateSteer(e){
  const rect=wheel.getBoundingClientRect();
  const x=e.clientX-rect.left-rect.width/2;

  steer=Math.max(-1,Math.min(1,x/60));

  indicator.style.transform=
    `translate(-50%,-100%) rotate(${steer*120}deg)`;
}

// ================= TRACK HELP =================
function closest(x,y){

  let best=null;
  let bd=99999;

  for(let i=0;i<track.length;i++){

    let a=track[i];
    let b=track[(i+1)%track.length];

    let p=project(x,y,a,b);

    let d=Math.hypot(p.x-x,p.y-y);

    if(d<bd){
      bd=d;
      best=p;
    }
  }

  return best;
}

function project(px,py,a,b){

  let vx=b.x-a.x;
  let vy=b.y-a.y;

  let wx=px-a.x;
  let wy=py-a.y;

  let t=(wx*vx+wy*vy)/(vx*vx+vy*vy);

  t=Math.max(0,Math.min(1,t));

  return{
    x:a.x+vx*t,
    y:a.y+vy*t
  };
}

// ================= PHYSICS =================
function keepOnTrack(car){

  let center=closest(car.x,car.y);

  let dx=center.x-car.x;
  let dy=center.y-car.y;

  let dist=Math.hypot(dx,dy);

  if(dist>trackWidth){
    car.x+=dx*0.08;
    car.y+=dy*0.08;
    car.speed*=0.92;
  }
}

// ================= CAR =================
class Car{

  constructor(i,name){
    this.name=name;
    this.x=track[0].x;
    this.y=track[0].y;

    this.cp=1;
    this.lap=0;

    this.angle=0;
    this.speed=2;

    this.color=`hsl(${i*50},80%,60%)`;

    this.finished=false;
  }

  update(){

    if(this.finished) return;

    let target=track[this.cp];

    // leichte Randomness für Bots
    target={
      x:target.x+(Math.random()-0.5)*35,
      y:target.y+(Math.random()-0.5)*35
    };

    let dx=target.x-this.x;
    let dy=target.y-this.y;

    let ang=Math.atan2(dy,dx);

    let diff=ang-this.angle;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));

    this.angle+=diff*0.05;

    this.speed=2.8;

    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;

    keepOnTrack(this);

    let dist=Math.hypot(dx,dy);

    if(dist<50){
      this.cp++;
      if(this.cp>=track.length){
        this.cp=0;
        this.lap++;
        if(this.lap>=maxLaps) this.finished=true;
      }
    }
  }

  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);

    ctx.restore();
  }
}

// ================= PLAYER =================
class Player extends Car{

  constructor(){
    super(999,"You");
    this.color="white";
  }

  update(){

    let targetAngle=this.angle+steer*0.1;

    this.angle+= (targetAngle-this.angle)*0.2;

    this.speed=3;

    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;

    keepOnTrack(this);
  }
}

let cars=[];
let player;
let maxLaps=5;
let running=false;

// ================= START =================
function start(){

  cars=[];
  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;

  player=new Player();
  cars.push(player);

  for(let i=0;i<n;i++){
    cars.push(new Car(i,"Bot "+(i+1)));
  }

  running=true;
}

// ================= TRACK DRAW =================
function drawTrack(){

  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);

  for(let p of track) ctx.lineTo(p.x,p.y);

  ctx.closePath();
  ctx.stroke();

  // Ziellinie (fix am Startpunkt)
  let start=track[0];

  ctx.strokeStyle="white";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(start.x-25,start.y-25);
  ctx.lineTo(start.x+25,start.y+25);
  ctx.stroke();

  // checkpoints
  ctx.fillStyle="yellow";
  track.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,6,0,Math.PI*2);
    ctx.fill();
  });
}

// ================= SCORE =================
function score(){

  let sorted=[...cars].sort((a,b)=>b.lap-a.lap);

  let html="<h3>🏆 Ranking</h3>";

  sorted.forEach((c,i)=>{
    html+=`${i+1}. ${c.name} | Lap ${c.lap}<br>`;
  });

  document.getElementById("score").innerHTML=html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  drawTrack();

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
  });

  score();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
