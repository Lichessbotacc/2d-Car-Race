<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena Fixed+</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}

#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:260px;color:white;
}

input,button{
width:100%;
margin-top:6px;
padding:8px;
border:none;
border-radius:6px;
}

button{background:#00c27a;color:white;font-weight:bold;}

#score{margin-top:10px;font-size:13px;}
</style>
</head>

<body>

<div id="ui">
<h3>🏁 Racing Arena</h3>

Bots:
<input id="bots" type="number" value="6">

Runden:
<input id="laps" type="number" value="5">

<button onclick="start()">START</button>

<div id="score"></div>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

// ================= TRACK =================
const track=[
  {x:cx+300,y:cy},
  {x:cx+200,y:cy-200},
  {x:cx-100,y:cy-220},
  {x:cx-300,y:cy-50},
  {x:cx-200,y:cy+200},
  {x:cx+100,y:cy+220}
];

const trackWidth=70;

// ================= CAR =================
class Car{
  constructor(i,name,isPlayer=false){

    this.name=name;
    this.isPlayer=isPlayer;

    this.x=track[0].x;
    this.y=track[0].y;

    this.cp=1;
    this.lap=0;

    this.angle=0;

    this.speed=3; // ⚖️ ALLE GLEICH SCHNELL

    this.color=isPlayer?"white":`hsl(${i*50},80%,60%)`;

    this.finished=false;
  }

  update(){

    if(this.finished) return;

    let t=track[this.cp];

    let dx=t.x-this.x;
    let dy=t.y-this.y;

    let dist=Math.hypot(dx,dy);

    let ang=Math.atan2(dy,dx);

    // ================= PLAYER / BOT =================
    if(this.isPlayer){
      this.angle += (steerAngle-this.angle)*0.2;
    } else {
      this.angle += (ang-this.angle)*0.12;
    }

    // ⚖️ FIX: gleiche Geschwindigkeit
    this.speed = 3;

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    // ================= TRACK LIMIT =================
    let center=closest(this.x,this.y);
    let d=Math.hypot(center.x-this.x,center.y-this.y);

    if(d>trackWidth){
      this.x+=(center.x-this.x)*0.08;
      this.y+=(center.y-this.y)*0.08;
    }

    // ================= LAP FIX =================
    if(dist<75){ // größer = nicht verpassen
      this.cp++;

      if(this.cp>=track.length){
        this.cp=0;
        this.lap++;
        if(this.lap>=maxLaps)this.finished=true;
      }
    }

    // ================= COLLISION FIX =================
    cars.forEach(o=>{
      if(o===this) return;

      let dx=this.x-o.x;
      let dy=this.y-o.y;
      let d=Math.hypot(dx,dy);

      if(d<24 && d>0){

        let nx=dx/d;
        let ny=dy/d;

        let push=(24-d)/2;

        this.x+=nx*push;
        this.y+=ny*push;

        o.x-=nx*push;
        o.y-=ny*push;
      }
    });
  }

  draw(){

    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    ctx.fillText(this.name,this.x,this.y-15);
  }
}

// ================= STEERING (simple preserved) =================
let steerAngle=0;

window.addEventListener("mousemove",(e)=>{
  steerAngle=Math.atan2(
    e.clientY-cy,
    e.clientX-cx
  );
});

// ================= HELP =================
function closest(x,y){

  let best=null;
  let bd=99999;

  for(let i=0;i<track.length;i++){

    let a=track[i];
    let b=track[(i+1)%track.length];

    let vx=b.x-a.x;
    let vy=b.y-a.y;

    let wx=x-a.x;
    let wy=y-a.y;

    let t=(wx*vx+wy*vy)/(vx*vx+vy*vy);
    t=Math.max(0,Math.min(1,t));

    let px=a.x+vx*t;
    let py=a.y+vy*t;

    let d=Math.hypot(px-x,py-y);

    if(d<bd){
      bd=d;
      best={x:px,y:py};
    }
  }

  return best;
}

// ================= GAME =================
let cars=[];
let maxLaps=5;
let running=false;

function start(){

  cars=[];
  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;

  cars.push(new Car(999,"Player",true));

  for(let i=0;i<n;i++){
    cars.push(new Car(i,"Bot "+(i+1)));
  }

  running=true;
}

// ================= TRACK DRAW =================
function drawTrack(){

  // Straße
  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);
  track.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.stroke();

  // ================= ZIELLINIE (BIG FIX) =================
  ctx.strokeStyle="yellow";
  ctx.lineWidth=10;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);
  ctx.lineTo(track[1].x,track[1].y);
  ctx.stroke();
}

// ================= SCORE =================
function score(){

  let sorted=[...cars].sort((a,b)=>b.lap-a.lap);

  let html="<h3>🏆 Ranking</h3>";

  sorted.forEach((c,i)=>{
    html+=`${i+1}. ${c.name} | Lap ${c.lap}<br>`;
  });

  document.getElementById("score").innerHTML=html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  drawTrack();

  let done=true;

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
    if(!c.finished)done=false;
  });

  score();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
