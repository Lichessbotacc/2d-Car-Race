<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena Fixed</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}
#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:260px;color:white;
}
input,button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:6px;}
button{background:#00c27a;color:white;font-weight:bold;}
#score{margin-top:10px;font-size:13px;}

#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
background:#111;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
}

#menu h2{
font-size:40px;
margin-bottom:20px;
}

#menu button{
width:200px;
margin:8px;
font-size:16px;
}
</style>
</head>

<body>

<div id="ui" style="display:none;">
<h3>🏁 Racing Arena</h3>

Bots:
<input id="bots" type="number" value="6">

Runden:
<input id="laps" type="number" value="5">

Spielername:
<input id="playerName" type="text" value="Player">

<button onclick="startRace()">START</button>

<div id="score"></div>
<div id="itemDisplay"></div>
<button id="useItemBtn">USE ITEM</button>
</div>

<div id="menu">
  <h2>🏁 Racing Arena</h2>

  <button onclick="startGameFromMenu()">▶ Start Game</button>
  <button onclick="alert('Noch kein Multiplayer eingebaut 😄')">🌐 Multiplayer</button>
  <button onclick="alert('Settings kommen gleich unten im Menü')">⚙ Settings</button>
</div>
  
<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");
let menu = document.getElementById("menu");
let ui = document.getElementById("ui");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

// ================= TRACK (mehrere Checkpoints!) =================
const track=[
  {x:cx+300,y:cy},
  {x:cx+200,y:cy-200},
  {x:cx-100,y:cy-220},
  {x:cx-300,y:cy-50},
  {x:cx-200,y:cy+200},
  {x:cx+100,y:cy+220}
];
const checkpoints=[];

for(let i=0;i<track.length;i++){

  let a=track[i];
  let b=track[(i+1)%track.length];

  let mx=(a.x+b.x)/2;
  let my=(a.y+b.y)/2;

  checkpoints.push({
    x:mx,
    y:my
  });
}

const trackWidth=70;

// ================= CAR =================
class Car{
  constructor(i,name,skill=1){

  this.skill = skill;

    this.name=name;

    // Richtung der Strecke
let dx = track[1].x - track[0].x;
let dy = track[1].y - track[0].y;

this.angle = Math.atan2(dy, dx);

// Normale der Strecke
let len = Math.hypot(dx, dy);
let nx = -dy / len;
let ny = dx / len;

// Startposition sauber auf der Strecke
let row = Math.floor(i / 2);
let side = (i % 2 === 0 ? -1 : 1);

this.x =
  track[0].x
  - dx / len * row * 40
  + nx * side * 20;

this.y =
  track[0].y
  - dy / len * row * 40
  + ny * side * 20;

    this.cp=1;
    this.lastLapTime = performance.now();
    this.bestLapTime = Infinity;

    this.speed=3;
    this.targetSpeed=3;
    this.boostTimer=0;

    this.color=`hsl(${i*50},80%,60%)`;

    this.finished=false;
    this.points=0;
    this.spin = 0;
    this.isPlayer = false;

    
  }

  update(){

    if(this.finished) return;
    if(this.item==="boost"){

      this.speed+=0.15;
    }

    if(this.item==="spin"){

      cars.forEach(o=>{

        if(o===this) return;

        let d=Math.hypot(o.x-this.x,o.y-this.y);

        if(d<80){

      o.spin=1;
        }
      });
    }

    if(this.isPlayer){

      if(touchTarget){

        let dx = touchTarget.x - this.x;
        let dy = touchTarget.y - this.y;

        let angle = Math.atan2(dy, dx);

        let diff = angle - this.angle;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));

        this.angle += diff * 0.12;
      }

      

      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;

      let center = closest(this.x,this.y);

      let d = Math.hypot(center.x-this.x, center.y-this.y);

      if(d > trackWidth){
        this.x += (center.x-this.x)*0.08;
        this.y += (center.y-this.y)*0.08;
        this.speed *= 0.9;
      }

      let target = checkpoints[this.cp];

      let dist = Math.hypot(
        target.x - this.x,
        target.y - this.y
      );

      if(dist < 90){

        this.cp++;

        if(this.cp >= checkpoints.length){

          this.cp = 0;
          this.lap++;

          let now = performance.now();
          let lapTime = now - this.lastLapTime;

          this.lastLapTime = now;

           // Bestzeit speichern
           if(lapTime < this.bestLapTime){
              this.bestLapTime = lapTime;
             }

  if(this.lap >= maxLaps){
    this.finished = true;
  }
}

          if(this.lap >= maxLaps){
            this.finished = true;
          }
        }
      }

      return;
    }
        if(!this.isPlayer && this.item){

      if(Math.random()<0.01){

        if(this.item==="boost"){
          this.boostTimer = 60;
          this.item = null;
        }

       if(this.item==="spin"){

          cars.forEach(o=>{

            if(o===this) return;

            let d=Math.hypot(o.x-this.x,o.y-this.y);

            if(d<100){
              o.spin=1;
            }
          });
        }

        this.item=null;
      }
    }

    let skillFactor = this.skill;

    if(Math.random()<(1-this.skill)*0.002){
      this.spin=1;
    }

    if(this.spin>0){
      this.angle+=0.3;
      this.speed*=0.4;
      this.spin-=0.02;
    }

    // bessere Bots sind stabiler
    if(this.boostTimer > 0){
  this.currentSpeed = 6;
  this.boostTimer--;
}else{
  this.currentSpeed = this.targetSpeed;
}

this.speed = this.currentSpeed;

    let error=(1-this.skill)*40;

    let next = track[this.cp];
    let after = track[(this.cp + 1) % track.length];

    // Ziel = Mischung aus aktuellem + nächstem Checkpoint
    let target = {
      x: next.x * 0.7 + after.x * 0.3,
      y: next.y * 0.7 + after.y * 0.3
    };

    cars.forEach(o=>{
      if(o===this) return;

      let d=Math.hypot(o.x-this.x,o.y-this.y);

      if(d<60 && o.speed<this.speed){
        target.x += (this.x-o.x)*0.2;
        target.y += (this.y-o.y)*0.2;
      }
    });

    let dx=target.x-this.x;
    let dy=target.y-this.y;

    let dist=Math.hypot(dx,dy);

    let ang=Math.atan2(dy,dx);

    let turnSpeed = 0.05 + this.skill * 0.1;

    let diff = ang - this.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));

    this.angle += diff * turnSpeed;

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    // Strecke erzwingen
    let center=closest(this.x,this.y);

    let d=Math.hypot(center.x-this.x,center.y-this.y);

    if(d>trackWidth){
      this.x += (center.x-this.x)*0.08;
      this.y += (center.y-this.y)*0.08;
      this.speed*=0.9;
    }

    // checkpoint FIX (kein Bug mehr!)
    if(dist < 90){
      this.cp++;

      if(this.cp >= checkpoints.length){
        this.cp=0;
        this.lap++;

        if(this.lap >= maxLaps && !this.finished){
          this.finished = true;
          this.finishTime = performance.now();
}
      }
    }

    // collision
    cars.forEach(o=>{
      if(o===this) return;

      let d=Math.hypot(o.x-this.x,o.y-this.y);

      if(d<22){

        let push=(22-d)/2;

        let nx=(this.x-o.x)/(d||1);
        let ny=(this.y-o.y)/(d||1);

        this.x+=nx*push;
        this.y+=ny*push;

        o.x-=nx*push;
        o.y-=ny*push;

        this.speed*=0.9;
      }
    });
  }

  draw(){

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);

    ctx.restore();

  // 🏷️ NAME ÜBER AUTO
    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    ctx.fillText(this.name, this.x, this.y - 15);
  }
}
class ItemBox{

  constructor(x,y){
    this.x=x;
    this.y=y;
    this.active=true;
    this.respawn=0;
  }

  update(){

    if(!this.active){

      this.respawn--;

      if(this.respawn<=0){
        this.active=true;
      }
    }
  }

  draw(){

    if(!this.active) return;

    ctx.save();

    ctx.translate(this.x,this.y);

    ctx.fillStyle="gold";
    ctx.fillRect(-12,-12,24,24);

    ctx.strokeStyle="white";
    ctx.strokeRect(-12,-12,24,24);

    ctx.restore();
  }

  check(car){

    if(!this.active) return;

    let d=Math.hypot(car.x-this.x,car.y-this.y);

    if(d<25){

      this.active=false;
      this.respawn=300;

      giveItem(car);
    }
  }
}

function giveItem(car){

 
  const pool=[
  "boost",
  "spin",
  "banana",
  "rocket",
  "explosion"
];

  car.item=
  pool[Math.floor(Math.random()*pool.length)];
  car.itemCooldown = 0;

  if(car.isPlayer){
    playerItem=car.item;
  }
}
c.addEventListener("touchstart", e=>{
  let t = e.touches[0];
  const rect = c.getBoundingClientRect();

  touchTarget = {
    x: t.clientX - rect.left,
    y: t.clientY - rect.top
  };
});
class Explosion{

  constructor(x,y){
    this.x=x;
    this.y=y;
    this.life=30;
  }

  update(){
    this.life--;
  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      40-this.life,
      0,
      Math.PI*2
    );

    ctx.strokeStyle="orange";
    ctx.lineWidth=4;
    ctx.stroke();
  }
}
class Banana{

  constructor(x,y){
    this.x=x;
    this.y=y;
  }

  draw(){

    ctx.fillStyle="yellow";

    ctx.beginPath();

    ctx.arc(this.x,this.y,8,0,Math.PI*2);

    ctx.fill();
  }

  check(car){

    let d=Math.hypot(car.x-this.x,car.y-this.y);

    if(d<18){

      car.spin=1;

      explosions.push(
        new Explosion(this.x,this.y)
      );

      return true;
    }

    return false;
  }
}
class Rocket{

  constructor(owner){

    this.x=owner.x;
    this.y=owner.y;

    this.angle=owner.angle;

    this.owner=owner;

    this.dead=false;
  }

  update(){

    this.x+=Math.cos(this.angle)*8;
    this.y+=Math.sin(this.angle)*8;

    cars.forEach(c=>{

      if(c===this.owner) return;

      let d=Math.hypot(c.x-this.x,c.y-this.y);

      if(d<20){

        c.spin=1.5;

        explosions.push(
          new Explosion(this.x,this.y)
        );

        this.dead=true;
      }
    });
  }

  draw(){

    ctx.save();

    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle="red";

    ctx.fillRect(-10,-4,20,8);

    ctx.restore();
  }
}
c.addEventListener("touchmove", e=>{
  e.preventDefault();

  let t = e.touches[0];
  const rect = c.getBoundingClientRect();

  touchTarget = {
    x: t.clientX - rect.left,
    y: t.clientY - rect.top
  };
});

function showSettings(){
  menu.style.display = "none";
  ui.style.display = "block";
}
// ================= TRACK HELP =================
function closest(x,y){

  let best=null;
  let bd=99999;

  for(let i=0;i<track.length;i++){

    let a=track[i];
    let b=track[(i+1)%track.length];

    let p=project(x,y,a,b);

    let d=Math.hypot(p.x-x,p.y-y);

    if(d<bd){
      bd=d;
      best=p;
    }
  }

  return best;
}

function project(px,py,a,b){

  let vx=b.x-a.x;
  let vy=b.y-a.y;

  let wx=px-a.x;
  let wy=py-a.y;

  let t=(wx*vx+wy*vy)/(vx*vx+vy*vy);

  t=Math.max(0,Math.min(1,t));

  return{
    x:a.x+vx*t,
    y:a.y+vy*t
  };
}

// ================= GAME =================
let cars=[];
let maxLaps=5;
let running=false;
let touchTarget = null;
let items = [];
let playerItem = null;
let bananas = [];
let rockets = [];
let explosions = [];


function startRace(){

cars=[];

let n=+document.getElementById("bots").value;

maxLaps=+document.getElementById("laps").value;

let playerName=
document.getElementById("playerName").value || "Player";

// SPIELER
let player=new Car(0,playerName,0.65);

player.isPlayer=true;

cars.push(player);

// BOTS
for(let i=1;i<n;i++){

cars.push(
new Car(i,"Bot "+i,0.65)
);

}

items=[];

for(let i=0;i<8;i++){

  let p=
  track[Math.floor(Math.random()*track.length)];

  items.push(

    new ItemBox(

      p.x+(Math.random()-0.5)*120,
      p.y+(Math.random()-0.5)*120
    )
  );
}

running=false;

countdown(()=>{
running=true;
});

}

// ================= DRAW TRACK =================
function drawTrack(){

  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);

  for(let p of track){
    ctx.lineTo(p.x,p.y);
  }

  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.setLineDash([10,10]);
  ctx.stroke();
  ctx.setLineDash([]);

  // checkpoints sichtbar
  // checkpoints als LINIE (Gates)
ctx.strokeStyle = "yellow";
ctx.lineWidth = 4;

for (let i = 0; i < track.length; i++) {

  let a = track[i];
  let b = track[(i + 1) % track.length];

  // Mittelpunkt zwischen zwei Punkten = Checkpoint-Position
  let mx = (a.x + b.x) / 2;
  let my = (a.y + b.y) / 2;

  // Richtung der Strecke
  let dx = b.x - a.x;
  let dy = b.y - a.y;

  // Normale (90° gedreht) → damit Linie quer zur Strecke steht
  let len = Math.hypot(dx, dy) || 1;
  dx /= len;
  dy /= len;

  let nx = -dy;
  let ny = dx;

  let size = 80; // Länge der Checkpoint-Linie

  ctx.beginPath();
  ctx.moveTo(mx - nx * size, my - ny * size);
  ctx.lineTo(mx + nx * size, my + ny * size);
  ctx.stroke();
}
}

// ================= SCORE (FIXED!) =================
function score(){

  cars.forEach(c=>{

    // Zielcheckpoint
    let target = checkpoints[c.cp];

    // Distanz zum nächsten Checkpoint
    let dist = Math.hypot(target.x - c.x, target.y - c.y);

    // Mehr Fortschritt = bessere Position
    c.progress =
      c.lap * 100000 +
      c.cp * 1000 -
      dist;
  });

  let sorted = [...cars].sort((a,b)=>{

  if(a.finished && !b.finished) return -1;
  if(!a.finished && b.finished) return 1;

  if(a.finished && b.finished){
    return a.finishTime - b.finishTime;
  }

  return b.progress - a.progress;
});

  let html = "<h3>🏆 Live Ranking</h3>";

  let player = cars.find(c => c.isPlayer);
  if(player && player.bestLapTime !== Infinity){
  html += ` | Best Lap: ${(sorted[0].bestLapTime/1000).toFixed(2)}s`;
}

  sorted.forEach((c,i)=>{
    html += `${i+1}. ${c.name} | Lap ${c.lap}<br>`;
  });

  document.getElementById("score").innerHTML = html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  drawTrack();
bananas.forEach(b=>{
  b.draw();
});

rockets.forEach(r=>{
  r.update();
  r.draw();
});

rockets=
rockets.filter(r=>!r.dead);

explosions.forEach(e=>{
  e.update();
  e.draw();
});

explosions=
explosions.filter(e=>e.life>0);

  items.forEach(i=>{
    i.update();
    i.draw();
  });
  bananas=
  bananas.filter(b=>!b.check(c));

  let done=true;

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
    items.forEach(i=>{
    i.check(c);
  });
    if(!c.finished)done=false;
  });

  if(running && done){
    running=false;

    cars.forEach((c,i)=>{
      c.points += [10,7,5,3,1][i] || 1;
    });
  }

  score();

  requestAnimationFrame(loop);
}

function countdown(cb){

  let el=document.createElement("div");
  el.style.position="absolute";
  el.style.top="50%";
  el.style.left="50%";
  el.style.transform="translate(-50%,-50%)";
  el.style.fontSize="80px";
  el.style.color="white";
  document.body.appendChild(el);

  let n=3;

  let int=setInterval(()=>{

    if(n===0){
      el.innerText="GO!";
      setTimeout(()=>{
        el.remove();
        clearInterval(int);
        cb();
      },800);
      return;
    }

    el.innerText=n;
    n--;

  },1000);
}
window.addEventListener("resize", ()=>{
  c.width = innerWidth;
  c.height = innerHeight;
});
document
.getElementById("useItemBtn")
.onclick=()=>{

  let player=
  cars.find(c=>c.isPlayer);

  if(!player || !player.item) return;

  if(player.item==="boost"){

    player.boostTimer=60;
  }

  if(player.item==="spin"){

    cars.forEach(o=>{

      if(o===player) return;

      let d=Math.hypot(
        o.x-player.x,
        o.y-player.y
      );

      if(d<120){
        o.spin=1;
      }
    });
  }

  if(player.item==="banana"){

    bananas.push(
      new Banana(player.x,player.y)
    );
  }

  if(player.item==="rocket"){

    rockets.push(
      new Rocket(player)
    );
  }

  player.item=null;
  playerItem=null;
};


loop();
function startGameFromMenu(){
  menu.style.display = "none";
  ui.style.display = "block";
  startRace();
}
</script>

</body>
</html>
