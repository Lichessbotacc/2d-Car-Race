<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#1b1b1b;
  font-family:Arial;
  color:white;
}

canvas{
  display:block;
}

#ui{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.75);
  padding:12px;
  border-radius:12px;
  width:260px;
  z-index:10;
}

input,button{
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:8px;
}

button{
  background:#00c27a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00e08c;
}

#score{
  margin-top:10px;
  font-size:13px;
  max-height:280px;
  overflow:auto;
}
</style>
</head>
<body>

<div id="ui">
<h2>🏁 Racing Arena</h2>

Bots:
<input id="bots" type="number" value="6" min="2" max="20">

Runden:
<input id="laps" type="number" value="5" min="1" max="20">

<button onclick="start()">START</button>

<div id="score"></div>
</div>

<canvas id="c"></canvas>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

const cx = c.width/2;
const cy = c.height/2;

// ================= TRACK MASK =================
const track = document.createElement("canvas");
const tctx = track.getContext("2d");

track.width = c.width;
track.height = c.height;

// Checkpoints (für echte Strecke)
const checkpoints = [
  {x: cx+300, y: cy},
  {x: cx, y: cy-200},
  {x: cx-300, y: cy},
  {x: cx, y: cy+200}
];

function buildTrack(){

  // Gras
  tctx.fillStyle="#2e7d32";
  tctx.fillRect(0,0,track.width,track.height);

  // Straße (Ringbahn)
  tctx.fillStyle="#555";

  tctx.beginPath();
  tctx.ellipse(cx,cy,340,220,0,0,Math.PI*2);
  tctx.fill();

  // Innen Gras Loch
  tctx.globalCompositeOperation="destination-out";
  tctx.beginPath();
  tctx.ellipse(cx,cy,220,120,0,0,Math.PI*2);
  tctx.fill();
  tctx.globalCompositeOperation="source-over";
}

// ================= CAR =================
class Car{
  constructor(i){

    this.x = cx + 260;
    this.y = cy;

    this.angle = 0;
    this.speed = 2;

    this.targetSpeed = this.speed;

    this.w = 22;
    this.h = 12;

    this.color = `hsl(${i*40},80%,60%)`;

    this.cp = 0;
    this.laps = 0;
    this.finished = false;
    this.points = 0;

    setInterval(()=>{
      this.targetSpeed = 1 + Math.random()*3;
    },1000);
  }

  update(){

    if(this.finished) return;

    // Speed smooth random
    this.speed += (this.targetSpeed - this.speed)*0.05;

    let target = checkpoints[this.cp];

    let dx = target.x - this.x;
    let dy = target.y - this.y;

    let dist = Math.hypot(dx,dy);

    let desiredAngle = Math.atan2(dy,dx);

    this.angle += (desiredAngle - this.angle)*0.08;

    let nx = this.x + Math.cos(this.angle)*this.speed;
    let ny = this.y + Math.sin(this.angle)*this.speed;

    // Road check
    if(onRoad(nx,ny)){
      this.x = nx;
      this.y = ny;
    }else{
      this.angle += 0.5;
      this.speed *= 0.6;
    }

    // Checkpoint
    if(dist < 50){
      this.cp++;

      if(this.cp >= checkpoints.length){
        this.cp = 0;
        this.laps++;

        if(this.laps >= maxLaps){
          this.finished = true;
        }
      }
    }

    // Car collision
    cars.forEach(o=>{
      if(o===this) return;

      let d = Math.hypot(o.x-this.x,o.y-this.y);

      if(d < 22){
        let push = (22-d)/2;

        let nx = (this.x - o.x)/d;
        let ny = (this.y - o.y)/d;

        this.x += nx*push;
        this.y += ny*push;

        o.x -= nx*push;
        o.y -= ny*push;

        this.speed *= 0.9;
      }
    });
  }

  draw(){

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-11,-6,22,12);

    ctx.fillStyle="#111";
    ctx.fillRect(-5,-4,10,8);

    ctx.restore();
  }
}

// ================= CHECK ROAD =================
function onRoad(x,y){
  let p = tctx.getImageData(x,y,1,1).data;
  return p[0]>100 && p[1]>100;
}

// ================= GAME =================
let cars=[];
let maxLaps=5;
let running=false;

function start(){

  cars=[];
  buildTrack();

  let n = +document.getElementById("bots").value;
  maxLaps = +document.getElementById("laps").value;

  for(let i=0;i<n;i++){
    cars.push(new Car(i));
  }

  running=true;
}

// ================= SCORE =================
function score(){

  cars.sort((a,b)=>b.laps-a.laps);

  let html="<h3>🏆</h3>";

  cars.forEach((c,i)=>{
    html+=`${i+1}. Lap ${c.laps} | ${c.points} pts<br>`;
  });

  document.getElementById("score").innerHTML=html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  ctx.drawImage(track,0,0);

  // checkpoints
  ctx.fillStyle="yellow";
  checkpoints.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,10,0,Math.PI*2);
    ctx.fill();
  });

  let done=true;

  cars.forEach(c=>{
    if(running) c.update();
    c.draw();
    if(!c.finished) done=false;
  });

  if(running && done){
    running=false;

    cars.sort((a,b)=>b.laps-a.laps);

    cars.forEach((c,i)=>{
      c.points += [10,7,5,3,1][i] || 1;
    });
  }

  score();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
