<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena Fixed</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}

#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:260px;color:white;
}

input,button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:6px;}
button{background:#00c27a;color:white;font-weight:bold;}
#score{margin-top:10px;font-size:13px;}

#menu{
position:absolute;
top:0;left:0;
width:100%;
height:100%;
background:#111;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
}

#menu h2{font-size:40px;margin-bottom:20px;}
#menu button{width:200px;margin:8px;font-size:16px;}
</style>
</head>

<body>

<div id="ui" style="display:none;">
<h3>🏁 Racing Arena</h3>

Bots:
<input id="bots" type="number" value="6">

Runden:
<input id="laps" type="number" value="5">

Spielername:
<input id="playerName" type="text" value="Player">

<button onclick="startRace()">START</button>

<div id="score"></div>
<div id="itemDisplay"></div>
<button id="useItemBtn">USE ITEM</button>
</div>

<div id="menu">
<h2>🏁 Racing Arena</h2>

<button onclick="openGame()">▶ Start Game</button>
<button onclick="alert('Noch kein Multiplayer eingebaut 😄')">🌐 Multiplayer</button>
<button onclick="alert('Settings kommen gleich')">⚙ Settings</button>
</div>

<canvas id="c"></canvas>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

let menu = document.getElementById("menu");
let ui = document.getElementById("ui");

let cx, cy;
let track = [];
const trackWidth = 70;

function buildTrack(){
track = [
  {x:cx+300,y:cy},
  {x:cx+200,y:cy-200},
  {x:cx-100,y:cy-220},
  {x:cx-300,y:cy-50},
  {x:cx-200,y:cy+200},
  {x:cx+100,y:cy+220}
];
}

function resize(){
c.width = window.innerWidth;
c.height = window.innerHeight;

cx = c.width/2;
cy = c.height/2;

buildTrack();
}

resize();
window.addEventListener("resize", resize);

// ================= CAR =================
class Car{
constructor(i,name,skill=1){

this.skill = skill;
this.name = name;
this.item = null;

let dx = 1, dy = 0;

this.angle = 0;

this.x = cx;
this.y = cy;

this.cp = 1;
this.lap = 0;

this.speed = 2;
this.targetSpeed = 2;

this.color = `hsl(${i*50},80%,60%)`;

this.finished = false;
this.spin = 0;
this.isPlayer = false;

setInterval(()=>{
this.targetSpeed = 1 + Math.random()*3;
},1000);
}

update(){

if(this.finished) return;

if(this.isPlayer){

if(!touchTarget){
touchTarget = {x:this.x,y:this.y};
}

let dx = touchTarget.x - this.x;
let dy = touchTarget.y - this.y;

let angle = Math.atan2(dy,dx);

let diff = angle - this.angle;
diff = Math.atan2(Math.sin(diff),Math.cos(diff));

this.angle += diff * 0.12;

this.speed += (this.targetSpeed - this.speed) * 0.05;

this.x += Math.cos(this.angle)*this.speed;
this.y += Math.sin(this.angle)*this.speed;

let center = closest(this.x,this.y);
let d = Math.hypot(center.x-this.x,center.y-this.y);

if(d > trackWidth){
this.x += (center.x-this.x)*0.08;
this.y += (center.y-this.y)*0.08;
this.speed *= 0.9;
}

let target = track[this.cp];
let dist = Math.hypot(target.x-this.x,target.y-this.y);

if(dist < 50){
this.cp++;
if(this.cp >= track.length){
this.cp = 0;
this.lap++;
if(this.lap >= maxLaps) this.finished = true;
}
}

return;
}

// BOT LOGIC
let target = track[this.cp];

let dx = target.x - this.x;
let dy = target.y - this.y;

let ang = Math.atan2(dy,dx);

let diff = ang - this.angle;
diff = Math.atan2(Math.sin(diff),Math.cos(diff));

this.angle += diff * (0.05 + this.skill*0.1);

this.speed += (this.targetSpeed - this.speed) * (0.02 + this.skill*0.03);

this.x += Math.cos(this.angle)*this.speed;
this.y += Math.sin(this.angle)*this.speed;

let center = closest(this.x,this.y);
let d = Math.hypot(center.x-this.x,center.y-this.y);

if(d > trackWidth){
this.x += (center.x-this.x)*0.08;
this.y += (center.y-this.y)*0.08;
this.speed *= 0.9;
}

if(Math.hypot(target.x-this.x,target.y-this.y)<50){
this.cp++;
if(this.cp>=track.length){
this.cp=0;
this.lap++;
if(this.lap>=maxLaps)this.finished=true;
}
}

}

draw(){
ctx.save();
ctx.translate(this.x,this.y);
ctx.rotate(this.angle);

ctx.fillStyle=this.color;
ctx.fillRect(-10,-6,20,12);

ctx.restore();

ctx.fillStyle="white";
ctx.font="12px Arial";
ctx.textAlign="center";
ctx.fillText(this.name,this.x,this.y-15);
}
}

// ================= TRACK HELP =================
function closest(x,y){
let best=null;
let bd=99999;

for(let i=0;i<track.length;i++){
let a=track[i];
let b=track[(i+1)%track.length];

let p=project(x,y,a,b);
let d=Math.hypot(p.x-x,p.y-y);

if(d<bd){
bd=d;
best=p;
}
}
return best;
}

function project(px,py,a,b){
let vx=b.x-a.x;
let vy=b.y-a.y;

let wx=px-a.x;
let wy=py-a.y;

let t=(wx*vx+wy*vy)/(vx*vx+vy*vy);
t=Math.max(0,Math.min(1,t));

return {
x:a.x+vx*t,
y:a.y+vy*t
};
}

// ================= GAME =================
let cars=[];
let maxLaps=5;
let running=false;
let touchTarget=null;

function openGame(){
menu.style.display="none";
ui.style.display="block";
setTimeout(startRace,50);
}

function startRace(){

cars=[];

let n=+document.getElementById("bots").value;
maxLaps=+document.getElementById("laps").value;

let playerName=document.getElementById("playerName").value||"Player";

let player=new Car(0,playerName,0.65);
player.isPlayer=true;

cars.push(player);

for(let i=1;i<n;i++){
cars.push(new Car(i,"Bot "+i,0.65));
}

running=false;

countdown(()=>running=true);
}

// ================= DRAW =================
function drawTrack(){

ctx.strokeStyle="#555";
ctx.lineWidth=trackWidth*2;

ctx.beginPath();
ctx.moveTo(track[0].x,track[0].y);

for(let p of track) ctx.lineTo(p.x,p.y);

ctx.closePath();
ctx.stroke();
}

// ================= LOOP =================
function loop(){

ctx.clearRect(0,0,c.width,c.height);

drawTrack();

cars.forEach(c=>{
if(running)c.update();
c.draw();
});

requestAnimationFrame(loop);
}

function countdown(cb){
let el=document.createElement("div");
el.style.position="absolute";
el.style.top="50%";
el.style.left="50%";
el.style.transform="translate(-50%,-50%)";
el.style.fontSize="80px";
el.style.color="white";
document.body.appendChild(el);

let n=3;

let int=setInterval(()=>{
if(n===0){
el.innerText="GO!";
setTimeout(()=>{
el.remove();
clearInterval(int);
cb();
},800);
return;
}
el.innerText=n;
n--;
},1000);
}

loop();

</script>

</body>
</html>
