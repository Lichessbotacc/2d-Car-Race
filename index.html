<script>

window.onerror = function(msg, url, line, col, error){

};
const c=document.getElementById("c");
const ctx=c.getContext("2d");
let menu = document.getElementById("menu");
let ui = document.getElementById("ui");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

let currentTrackIndex = 0;
let track;

const tracks = [

  // ================= LEVEL 1 =================
  [
    {x:cx+300,y:cy},
    {x:cx+200,y:cy-200},
    {x:cx-100,y:cy-220},
    {x:cx-300,y:cy-50},
    {x:cx-200,y:cy+200},
    {x:cx+100,y:cy+220}
  ],

  // ================= LEVEL 2 (SCHLANGENFORM) =================
  [
    {x:cx-450,y:cy},
    {x:cx-250,y:cy-250},
    {x:cx,y:cy-100},
    {x:cx+250,y:cy-300},
    {x:cx+450,y:cy},
    {x:cx+200,y:cy+250},
    {x:cx-100,y:cy+150},
    {x:cx-350,y:cy+300}
  ],

  // ================= LEVEL 3 (LONG & NARROW) =================
[
  {x:cx-650,y:cy},

  {x:cx-500,y:cy-200},
  {x:cx-350,y:cy-350},
  {x:cx-200,y:cy-200},

  {x:cx-50,y:cy},
  {x:cx+100,y:cy+150},
  {x:cx+250,y:cy+300},
  {x:cx+400,y:cy+150},

  {x:cx+550,y:cy},
  {x:cx+450,y:cy-200},
  {x:cx+300,y:cy-350},
  {x:cx+150,y:cy-200},

  {x:cx,y:cy},
  {x:cx-150,y:cy+200},
  {x:cx-300,y:cy+350},
  {x:cx-450,y:cy+200},

  {x:cx-600,y:cy}
]

];

track = tracks[currentTrackIndex];

const trackWidth=70;

// ================= CAR =================
class Car{
  constructor(i,name,skill=1,type="middle"){

  this.skill = skill;
  this.type = type;
  this.name=name;
  this.id = i;

    // Richtung der Strecke
let dx = track[1].x - track[0].x;
let dy = track[1].y - track[0].y;

this.angle = Math.atan2(dy, dx);

// Normale der Strecke
let len = Math.hypot(dx, dy);
let nx = -dy / len;
let ny = dx / len;

// Startposition sauber auf der Strecke
this.x = track[0].x;
this.y = track[0].y;

    this.cp=1;
    this.lap=0;

    this.speed=3;
    this.targetSpeed=3;
    this.boostTimer=0;

    this.color=`hsl(${i*50},80%,60%)`;

    this.finished=false;
    this.points=0;
    this.spin = 0;
    this.isPlayer = false;

    
  }

  update(){

    if(this.finished) return;
    if(this.spin > 0){
  this.angle += 0.3;
  this.speed *= 0.4;
  this.spin -= 0.02;
}
}
    if(this.item==="boost"){

      this.speed+=0.15;
    }

    if(this.item==="spin"){

      cars.forEach(o=>{

        if(o===this) return;

        let d=Math.hypot(o.x-this.x,o.y-this.y);

        if(d<80){

      o.spin=1;
        }
      });
    }

    if(this.isPlayer){

      if(touchTarget){

        if(this.spin <= 0 && touchTarget){
  let dx = touchTarget.x - this.x;
  let dy = touchTarget.y - this.y;

  let angle = Math.atan2(dy, dx);
  let diff = angle - this.angle;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));

  this.angle += diff * 0.12;
}

      let baseSpeed = this.targetSpeed;

// BOOST
if(this.boostTimer > 0){
  baseSpeed = 6;
  this.boostTimer--;
}

// SPIN bremst dich
if(this.spin > 0){
  this.speed = baseSpeed * 0.4;
}else{
  this.speed = baseSpeed;
}

      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;

      let center = closest(this.x,this.y);

      let d = Math.hypot(center.x-this.x, center.y-this.y);

      if(d > trackWidth){
        this.x += (center.x-this.x)*0.08;
        this.y += (center.y-this.y)*0.08;
        this.speed *= 0.9;
      }

      let target = track[this.cp];

      let dist = Math.hypot(
        target.x - this.x,
        target.y - this.y
      );

      if(dist < 90){

        this.cp++;

        if(this.cp >= track.length){
          this.cp = 0;
          this.lap++;

          if(this.lap >= maxLaps){
            this.finished = true;
          }
        }
      }
 
      return;
    }
 // BOT ITEM LOGIC (NEU)
if(!this.isPlayer && this.item){

  let enemyNear = cars.some(o =>
    o !== this && Math.hypot(o.x-this.x,o.y-this.y) < 200
  );

  if(this.item === "spin" && enemyNear){
    cars.forEach(o=>{
      if(o !== this && Math.hypot(o.x-this.x,o.y-this.y) < 200){
        o.spin = 1;
      }
    });
  }

  if(this.item === "boost"){
    this.boostTimer = 60;
  }

  if(this.item === "banana"){
    let bx = this.x - Math.cos(this.angle) * 25;
    let by = this.y - Math.sin(this.angle) * 25;
    bananas.push(new Banana(bx, by));
  }

  if(this.item === "rocket"){
    rockets.push(new Rocket(this));
  }

  this.item = null;
}
  

    let skillFactor = this.skill;

    if(Math.random()<(1-this.skill)*0.002){
      this.spin=1;
    }

    if(this.spin>0){
      this.angle+=0.3;
      this.speed*=0.4;
      this.spin-=0.02;
    }

    // bessere Bots sind stabiler
    if(this.boostTimer>0){

        this.speed=6;
        this.boostTimer--;

        }else{

        this.speed=this.targetSpeed;
        }

    let error=(1-this.skill)*40;

    let next = track[this.cp];
    let after = track[(this.cp + 1) % track.length];

    // Ziel = Mischung aus aktuellem + nächstem Checkpoint
    let dirX = after.x - next.x;
let dirY = after.y - next.y;

let len = Math.hypot(dirX, dirY) || 1;

dirX /= len;
dirY /= len;

// Seitliche Richtung
let sideX = -dirY;
let sideY = dirX;

// Jeder Bot fährt leicht anders
let offset = 0;

if(this.type === "weak"){
  offset = Math.sin(Date.now()*0.003 + this.id) * 80;
}

if(this.type === "middle"){
  offset = Math.sin(Date.now()*0.002 + this.id) * 40;
}

if(this.type === "hard"){
  offset = Math.sin(Date.now()*0.0015 + this.id) * 15;
}

let target = {

  x:
    next.x * 0.7 +
    after.x * 0.3 +
    sideX * offset,

  y:
    next.y * 0.7 +
    after.y * 0.3 +
    sideY * offset
};

    cars.forEach(o=>{
      if(o===this) return;

      let d=Math.hypot(o.x-this.x,o.y-this.y);

      if(d<60 && o.speed<this.speed){
        target.x += (this.x-o.x)*0.2;
        target.y += (this.y-o.y)*0.2;
      }
    });

    let dx=target.x-this.x;
    let dy=target.y-this.y;

    let dist=Math.hypot(dx,dy);

    let ang=Math.atan2(dy,dx);

    
    let turnSpeed = 0.05 + this.skill * 0.1;

    let diff = ang - this.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));

    this.angle += diff * turnSpeed;

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    // Strecke erzwingen
    let center=closest(this.x,this.y);

    let d=Math.hypot(center.x-this.x,center.y-this.y);

    if(d>trackWidth){
      this.x += (center.x-this.x)*0.08;
      this.y += (center.y-this.y)*0.08;
      this.speed*=0.9;
    }

    // checkpoint FIX (kein Bug mehr!)
    if(dist < 90){
      this.cp++;

      if(this.cp>=track.length){
        this.cp=0;
        this.lap++;

        if(this.lap>=maxLaps){
          this.finished=true;
        }
      }
    }

    // collision
    cars.forEach(o=>{
      if(o===this) return;

      let d=Math.hypot(o.x-this.x,o.y-this.y);

      if(d<22){

        let push=(22-d)/2;

        let nx=(this.x-o.x)/(d||1);
        let ny=(this.y-o.y)/(d||1);

        this.x+=nx*push;
        this.y+=ny*push;

        o.x-=nx*push;
        o.y-=ny*push;

        this.speed*=0.9;
      }
    });
  }

  draw(){

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);

    ctx.restore();

  // 🏷️ NAME ÜBER AUTO
    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    let levelText = "";

if(this.type === "weak") levelText = "LVL 1";
if(this.type === "middle") levelText = "LVL 2";
if(this.type === "hard") levelText = "LVL 3";

// Name + Level anzeigen
ctx.fillText(`${this.name} (${levelText})`, this.x, this.y - 15);
  }
}
class ItemBox{

  constructor(x,y){
    this.x=x;
    this.y=y;
    this.active=true;
    this.respawn=0;
  }

  update(){

    if(!this.active){

      this.respawn--;

      if(this.respawn<=0){
        this.active=true;
      }
    }
  }

  draw(){

    if(!this.active) return;

    ctx.save();

    ctx.translate(this.x,this.y);

    ctx.fillStyle="gold";
    ctx.fillRect(-12,-12,24,24);

    ctx.strokeStyle="white";
    ctx.strokeRect(-12,-12,24,24);

    ctx.restore();
  }

  check(car){

    if(!this.active) return;

    let d=Math.hypot(car.x-this.x,car.y-this.y);

    if(d<25){

      this.active=false;
      this.respawn=300;

      giveItem(car);
    }
  }
}

function giveItem(car){

 
  const pool=[
  "boost",
  "spin",
  "banana",
  "rocket",
  "explosion"
];

  car.item=
  pool[Math.floor(Math.random()*pool.length)];

if(car.isPlayer){

  playerItem = car.item;

  document.getElementById("useItemBtn")
  .innerText =
  "🎁 Item: " + car.item.toUpperCase();
}
}
c.addEventListener("touchstart", e=>{
if(e.touches.length > 1) return;
  let t = e.touches[0];
  const rect = c.getBoundingClientRect();

  touchTarget = {

    x:
      (t.clientX - rect.left - c.width/2)
      / cameraZoom
      + c.width/2,

    y:
      (t.clientY - rect.top - c.height/2)
      / cameraZoom
      + c.height/2
  };


c.addEventListener("touchmove", e=>{
if(e.touches.length > 1) return;
  e.preventDefault();

  let t = e.touches[0];
  const rect = c.getBoundingClientRect();

  touchTarget = {

    x:
      (t.clientX - rect.left - c.width/2)
      / cameraZoom
      + c.width/2,

    y:
      (t.clientY - rect.top - c.height/2)
      / cameraZoom
      + c.height/2
  };
});
});
class Explosion{

  constructor(x,y){
    this.x=x;
    this.y=y;
    this.life=30;
  }

  update(){
    this.life--;
  }

  draw(){

    ctx.beginPath();

    ctx.arc(
      this.x,
      this.y,
      40-this.life,
      0,
      Math.PI*2
    );

    ctx.strokeStyle="orange";
    ctx.lineWidth=4;
    ctx.stroke();
  }
}
class Banana{

  constructor(x,y){
    this.x=x;
    this.y=y;
    this.active = true;
    this.life = 600;
  }

  draw(){

  if(!this.active) return;

  ctx.fillStyle="yellow";

    ctx.beginPath();

    ctx.arc(this.x,this.y,8,0,Math.PI*2);

    ctx.fill();
  }
  update(){

  this.life--;

  if(this.life <= 0){
    this.active = false;
  }
}

  check(car){

    let d=Math.hypot(car.x-this.x,car.y-this.y);

    if(d < 18){

  car.spin = Math.max(car.spin, 1);

  this.active = false;

  return true;
}

    return false;
  }
}
class Rocket{

  constructor(owner){

    this.x=owner.x;
    this.y=owner.y;

    this.angle=owner.angle;

    this.owner=owner;

    this.dead=false;
  }

  update(){

    this.x+=Math.cos(this.angle)*8;
    this.y+=Math.sin(this.angle)*8;

    cars.forEach(c=>{

      if(c===this.owner) return;

      let d=Math.hypot(c.x-this.x,c.y-this.y);

      if(d<20){

        c.spin = Math.max(c.spin, 1.5);

        explosions.push(
          new Explosion(this.x,this.y)
        );

        this.dead=true;
      }
    });
  }

  draw(){

    ctx.save();

    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle="red";

    ctx.fillRect(-10,-4,20,8);

    ctx.restore();
  }
}

// ================= TRACK HELP =================
function closest(x,y){

  let best=null;
  let bd=99999;

  for(let i=0;i<track.length;i++){

    let a=track[i];
    let b=track[(i+1)%track.length];

    let p=project(x,y,a,b);

    let d=Math.hypot(p.x-x,p.y-y);

    if(d<bd){
      bd=d;
      best=p;
    }
  }

  return best;
}
function zoomIn(){

  cameraZoom += 0.1;

  if(cameraZoom > maxZoom){
    cameraZoom = maxZoom;
  }
}

function zoomOut(){

  cameraZoom -= 0.1;

  if(cameraZoom < minZoom){
    cameraZoom = minZoom;
  }
}
function project(px,py,a,b){

  let vx=b.x-a.x;
  let vy=b.y-a.y;

  let wx=px-a.x;
  let wy=py-a.y;

  let t=(wx*vx+wy*vy)/(vx*vx+vy*vy);

  t=Math.max(0,Math.min(1,t));

  return{
    x:a.x+vx*t,
    y:a.y+vy*t
  };
}

// ================= DRAW TRACK =================
function drawTrack(){

  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);

  for(let p of track){
    ctx.lineTo(p.x,p.y);
  }

  ctx.closePath();
  ctx.stroke();

  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.setLineDash([10,10]);
  ctx.stroke();
  ctx.setLineDash([]);

  // checkpoints sichtbar
  // checkpoints als LINIE (Gates)
ctx.strokeStyle = "yellow";
ctx.lineWidth = 4;

for (let i = 0; i < track.length; i++) {

  let a = track[i];
  let b = track[(i + 1) % track.length];

  // Mittelpunkt zwischen zwei Punkten = Checkpoint-Position
  let mx = (a.x + b.x) / 2;
  let my = (a.y + b.y) / 2;

  // Richtung der Strecke
  let dx = b.x - a.x;
  let dy = b.y - a.y;

  // Normale (90° gedreht) → damit Linie quer zur Strecke steht
  let len = Math.hypot(dx, dy) || 1;
  dx /= len;
  dy /= len;

  let nx = -dy;
  let ny = dx;

  let size = 80; // Länge der Checkpoint-Linie

  ctx.beginPath();
  ctx.moveTo(mx - nx * size, my - ny * size);
  ctx.lineTo(mx + nx * size, my + ny * size);
  ctx.stroke();
}
}

// ================= SCORE (FIXED!) =================
function score(){

  cars.forEach(c=>{

    // Zielcheckpoint
    let target = track[c.cp];

    // Distanz zum nächsten Checkpoint
    let dist = Math.hypot(target.x - c.x, target.y - c.y);

    // Mehr Fortschritt = bessere Position
    c.progress =
      c.lap * 100000 +
      c.cp * 1000 -
      dist;
  });

  let sorted = [...cars].sort((a,b)=>b.progress-a.progress);

  let html = "<h3>🏆 Live Ranking</h3>";

  sorted.forEach((c,i)=>{

  let levelText = "";

  if(c.type === "weak") levelText = "LVL 1";
  if(c.type === "middle") levelText = "LVL 2";
  if(c.type === "hard") levelText = "LVL 3";

  html += `${i+1}. ${c.name} (${levelText}) | Lap ${c.lap}<br>`;
});

  document.getElementById("score").innerHTML = html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();

ctx.translate(c.width/2, c.height/2);

ctx.scale(cameraZoom, cameraZoom);

ctx.translate(-c.width/2, -c.height/2);

  drawTrack();
bananas.forEach(b=>{
  b.update();
  b.draw();
});
 bananas = bananas.filter(b => b.active);

rockets.forEach(r=>{
  r.update();
  r.draw();
});

rockets=
rockets.filter(r=>!r.dead);

explosions.forEach(e=>{
  e.update();
  e.draw();
});

explosions=
explosions.filter(e=>e.life>0);

  items.forEach(i=>{
    i.update();
    i.draw();
  });
 cars.forEach(car=>{
  bananas.forEach(b => b.check(car));
});

  let done=true;

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
    items.forEach(i=>{
    i.check(c);
  });
    if(!c.finished)done=false;
  });

  if(running && done){
    running=false;

    cars.forEach((c,i)=>{
      c.points += [10,7,5,3,1][i] || 1;
    });
  }

  score();
  ctx.restore();
  requestAnimationFrame(loop);
}

function countdown(cb){

  let el=document.createElement("div");
  el.style.position="absolute";
  el.style.top="50%";
  el.style.left="50%";
  el.style.transform="translate(-50%,-50%)";
  el.style.fontSize="80px";
  el.style.color="white";
  document.body.appendChild(el);

  let n=3;

  let int=setInterval(()=>{

    if(n===0){
      el.innerText="GO!";
      setTimeout(()=>{
        el.remove();
        clearInterval(int);
        cb();
      },800);
      return;
    }

    el.innerText=n;
    n--;

  },1000);
}
window.addEventListener("resize", ()=>{
  c.width = innerWidth;
  c.height = innerHeight;
});
function usePlayerItem(e){
  e.preventDefault();
  e.stopPropagation();

  let player = cars.find(c => c.isPlayer);

  if(!player || !player.item) return;

  if(player.item==="boost") player.boostTimer=60;

  if(player.item==="spin"){
    cars.forEach(o=>{
      if(o===player) return;
      let d=Math.hypot(o.x-player.x,o.y-player.y);
      if(d<120) o.spin=1;
    });
  }

  if(player.item==="banana"){

  let offset = 25; // Abstand hinter dem Auto

  let bx = player.x - Math.cos(player.angle) * offset;
  let by = player.y - Math.sin(player.angle) * offset;

  bananas.push(new Banana(bx, by));

}

  if(player.item==="rocket"){
    rockets.push(new Rocket(player));
  }

  player.item = null;
  playerItem = null;

  document.getElementById("useItemBtn")
  .innerText = "🎁 Item: NONE";
}
loop();

</script>
