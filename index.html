<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Racing Arena Elite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d11;
  --panel:#171b21;
  --panel-2:#1f242c;
  --line:#2a3038;
  --accent:#00e0a4;
  --accent-dim:#0a5f48;
  --amber:#ffb300;
  --danger:#ff4d5e;
  --yellow:#ffe066;
  --blue:#4da9ff;
  --purple:#b48bff;
  --text:#eef1f5;
  --text-dim:#9aa4b2;
}
*{box-sizing:border-box;}
html,body{
  margin:0;overflow:hidden;background:var(--bg);font-family:'Inter',Arial,sans-serif;color:var(--text);
  height:100%;width:100%;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  overscroll-behavior:none;
}
canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
h1,h2,h3,.display{font-family:'Rajdhani',Arial,sans-serif;font-weight:700;letter-spacing:0.02em;}

/* ---------- overlays ---------- */
.overlay{
  position:absolute;inset:0;overflow-y:auto;
  display:flex;flex-direction:column;
  justify-content:flex-start;align-items:center;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(0,224,164,0.10), transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(180,139,255,0.08), transparent 50%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 26px),
    var(--bg);
  z-index:20;
  color:var(--text);
  padding:40px 24px 60px 24px;
  text-align:center;
}
.overlay .eyebrow{
  color:var(--accent);
  font-family:'Rajdhani',Arial,sans-serif;
  font-weight:600;
  letter-spacing:0.35em;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:6px;
}
.overlay h2{
  font-size:48px;
  margin:0 0 24px 0;
  line-height:1;
}
.overlay h2 span{color:var(--accent);}

.menu-stack{display:flex;flex-direction:column;gap:10px;width:280px;}
.card-row{display:flex;flex-direction:column;gap:14px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,0.35);}
label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--text-dim);
  font-family:'Rajdhani',Arial,sans-serif;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
  gap:10px;
}
input[type=number],input[type=text]{
  width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--text);font-family:'Inter';font-size:14px;text-align:right;
}
input[type=text]{width:150px;text-align:left;}
select{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);color:var(--text);font-family:'Inter';font-size:13px;
}
button{
  cursor:pointer;border:none;border-radius:10px;padding:13px 18px;
  font-family:'Rajdhani',Arial,sans-serif;font-weight:700;font-size:16px;letter-spacing:0.03em;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
button:active{transform:scale(0.96);}
button.primary{background:linear-gradient(135deg,var(--accent),#00b98a);color:#04231a;border-color:var(--accent);box-shadow:0 4px 18px rgba(0,224,164,0.25);}
button.primary:hover{filter:brightness(1.1);}
button.ghost:hover{border-color:var(--accent);color:var(--accent);}
button.danger{background:var(--danger);color:#2b0004;border-color:var(--danger);}
button.gp{background:linear-gradient(135deg,var(--purple),#7a5cff);color:#170033;border-color:var(--purple);}

.toggle-row{display:flex;gap:8px;}
.toggle-row button{flex:1;padding:10px 8px;font-size:13px;}
.toggle-row button.active{background:var(--accent);color:#04231a;border-color:var(--accent);}

.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:340px;}
.track-card{
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:14px 10px;cursor:pointer;transition:border-color .15s, transform .08s;
}
.track-card:hover{border-color:var(--accent);}
.track-card:active{transform:scale(0.96);}
.track-card .tname{font-family:'Rajdhani';font-weight:700;font-size:16px;}
.track-card .tmeta{font-size:11px;color:var(--text-dim);margin-top:3px;}
.track-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim);}

/* ---------- HUD ---------- */
#hud{
  position:absolute;top:14px;left:14px;z-index:30;
  background:rgba(13,16,20,0.82);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  min-width:190px;max-width:250px;
  display:none;
  backdrop-filter:blur(6px);
}
#hud h4{margin:0 0 6px 0;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.15em;}
#rankList{font-size:13px;line-height:1.55;}
#rankList .me{color:var(--accent);font-weight:700;}
#lapInfo{margin-top:8px;font-size:12px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:8px;}
#gpInfo{margin-top:6px;font-size:11px;color:var(--purple);}

#mpLiveRank{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(13,16,20,0.82);border:1px solid var(--line);
  color:white;padding:10px 16px;border-radius:12px;font-size:12px;line-height:1.5;
  z-index:30;display:none;min-width:150px;text-align:left;backdrop-filter:blur(6px);
}

#exitRaceBtn{position:absolute;top:14px;right:14px;z-index:40;width:150px;display:none;}
#pauseBtn{position:absolute;top:14px;right:174px;z-index:40;width:90px;display:none;}

#itemSlot{
  position:absolute;right:20px;bottom:170px;z-index:40;
  width:150px;height:80px;padding:8px;background:linear-gradient(160deg,var(--amber),#e08e00);color:#2b1c00;font-weight:700;font-size:13px;
  border:none;border-radius:16px;display:none;font-family:'Rajdhani';box-shadow:0 4px 14px rgba(255,179,0,0.3);
  flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
#itemSlot .icon{font-size:30px;line-height:1;}
#itemSlot .charges{font-size:11px;opacity:0.8;}

#zoomControls{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:40;}
#zoomControls button{width:52px;height:52px;font-size:24px;border-radius:50%;background:rgba(23,27,33,0.85);border:1px solid var(--line);padding:0;}

.pui{z-index:60;}
.joy-base{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid var(--line);touch-action:none;box-shadow:inset 0 0 20px rgba(0,0,0,0.4);}
.joy-stick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--accent);opacity:0.9;pointer-events:none;box-shadow:0 0 12px rgba(0,224,164,0.6);}

#toast{
  position:absolute;top:80px;left:50%;transform:translateX(-50%);
  background:rgba(23,27,33,0.9);border:1px solid var(--accent);color:var(--accent);
  padding:8px 16px;border-radius:20px;font-family:'Rajdhani';font-weight:700;letter-spacing:0.05em;
  z-index:60;display:none;font-size:14px;
}

#countdownEl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;color:white;z-index:60;font-family:'Rajdhani';font-weight:700;text-shadow:0 0 30px rgba(0,224,164,0.5);pointer-events:none;}

#inkOverlay{position:absolute;inset:0;background:radial-gradient(circle at center, transparent 15%, rgba(0,0,0,0.92) 75%);z-index:55;display:none;pointer-events:none;}

#finishBanner{
  position:absolute;inset:0;z-index:70;background:rgba(13,16,20,0.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;
  overflow-y:auto;padding:30px 10px;
}
#finishBanner h2{font-size:44px;margin:0 0 6px 0;color:var(--accent);}
#finishList{font-size:16px;line-height:1.8;margin:18px 0;min-width:260px;}
#finishList .p1{color:var(--yellow);font-weight:700;}
#finishList .me{text-decoration:underline;}

#gpBanner{
  position:absolute;inset:0;z-index:70;background:rgba(13,16,20,0.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;
  overflow-y:auto;padding:30px 10px;
}
#gpStandings{font-size:15px;line-height:1.9;margin:18px 0;min-width:280px;}
#gpStandings .p1{color:var(--yellow);font-weight:700;}
#gpStandings .me{text-decoration:underline;}

.hidden{display:none !important;}
.flex-col{display:flex;flex-direction:column;}
</style>
</head>
<body>

<!-- ================= MAIN MENU ================= -->
<div id="menu" class="overlay">
  <div class="eyebrow">Grid · Ready</div>
  <h2>Racing <span>Arena</span></h2>
  <div class="menu-stack">
    <button class="primary" onclick="openSinglePlayerSetup()">🏁 Einzelrennen</button>
    <button class="gp" onclick="openGrandPrixSetup()">🏆 Grand Prix</button>
    <button class="ghost" onclick="openMultiplayerLevelSelect()">🌐 Mehrspieler</button>
    <button class="ghost" onclick="openSettings()">⚙ Einstellungen</button>
  </div>
</div>

<!-- ================= SETTINGS ================= -->
<div id="settingsScreen" class="overlay hidden">
  <div class="eyebrow">Optionen</div>
  <h2>Einstellungen</h2>
  <div class="card-row">
    <label>Steuerung</label>
    <div class="toggle-row">
      <button id="ctrlDragBtn" onclick="setControlScheme('drag')">👆 Ziehen</button>
      <button id="ctrlJoyBtn" onclick="setControlScheme('joystick')">🕹 Joystick</button>
    </div>
    <label>Grafik</label>
    <div class="toggle-row">
      <button id="gfxStdBtn" onclick="setGraphics('standard')">Standard</button>
      <button id="gfxHighBtn" onclick="setGraphics('high')">Hoch ✨</button>
    </div>
    <label>Kamera-Zoom</label>
    <div class="toggle-row">
      <button id="zoomNearBtn" onclick="setDefaultZoom(1.15)">Nah</button>
      <button id="zoomMidBtn" onclick="setDefaultZoom(0.95)">Mittel</button>
      <button id="zoomFarBtn" onclick="setDefaultZoom(0.7)">Weit</button>
    </div>
    <label>Ton</label>
    <div class="toggle-row">
      <button id="soundOnBtn" onclick="setSound(true)">An 🔊</button>
      <button id="soundOffBtn" onclick="setSound(false)">Aus 🔇</button>
    </div>
  </div>
  <button class="ghost" style="width:200px;" onclick="backToMenu()">⬅ Zurück</button>
</div>

<!-- ================= SINGLEPLAYER SETUP ================= -->
<div id="spSetup" class="overlay hidden">
  <div class="eyebrow">Einzelrennen</div>
  <h2>Rennen <span>einrichten</span></h2>
  <div class="card-row">
    <label>Fahrername <input id="playerName" type="text" value="Player"></label>
    <label>Bots <input id="bots" type="number" value="7" min="0" max="11"></label>
    <label>Runden <input id="laps" type="number" value="3" min="1" max="20"></label>
    <label>Schwierigkeit
      <select id="spDifficulty">
        <option value="easy">Leicht</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Schwer</option>
      </select>
    </label>
  </div>
  <div class="eyebrow" style="margin-bottom:10px;">Strecke wählen</div>
  <div class="track-grid" id="spTrackGrid"></div>
  <div style="height:14px;"></div>
  <button class="primary" style="width:200px;" onclick="startRace()">▶ START</button>
  <button class="ghost" style="width:200px;margin-top:8px;" onclick="backToMenu()">⬅ Zurück</button>
</div>

<!-- ================= GRAND PRIX SETUP ================= -->
<div id="gpSetup" class="overlay hidden">
  <div class="eyebrow">Grand Prix</div>
  <h2>Cup <span>einrichten</span></h2>
  <div class="card-row">
    <label>Fahrername <input id="gpPlayerName" type="text" value="Player"></label>
    <label>Bots <input id="gpBots" type="number" value="7" min="1" max="11"></label>
    <label>Runden pro Strecke <input id="gpLaps" type="number" value="3" min="1" max="10"></label>
    <label>Schwierigkeit
      <select id="gpDifficulty">
        <option value="easy">Leicht</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Schwer</option>
      </select>
    </label>
  </div>
  <div class="eyebrow" style="margin-bottom:10px;">Cup wählen (4 Strecken)</div>
  <div class="track-grid" id="gpCupGrid"></div>
  <div style="height:14px;"></div>
  <button class="gp" style="width:220px;" onclick="startGrandPrix()">🏆 CUP STARTEN</button>
  <button class="ghost" style="width:220px;margin-top:8px;" onclick="backToMenu()">⬅ Zurück</button>
</div>

<!-- ================= MULTIPLAYER: LEVEL SELECT ================= -->
<div id="mpLevelSelect" class="overlay hidden">
  <div class="eyebrow">Mehrspieler</div>
  <h2>Strecke <span>wählen</span></h2>
  <div class="track-grid" id="mpTrackGrid"></div>
  <div style="height:14px;"></div>
  <button class="ghost" style="width:200px;" onclick="backToMenu()">⬅ Zurück</button>
</div>

<!-- ================= MULTIPLAYER: SETUP ================= -->
<div id="mpSetup" class="overlay hidden">
  <div class="eyebrow">Mehrspieler</div>
  <h2>Rennen <span>einrichten</span></h2>
  <div class="card-row">
    <label>Spieler (1-4) <input id="mpPlayers" type="number" value="2" min="1" max="4"></label>
    <label>Bots <input id="mpBots" type="number" value="6" min="0" max="10"></label>
    <label>Runden <input id="mpLaps" type="number" value="3" min="1" max="20"></label>
  </div>
  <button class="primary" style="width:200px;" onclick="startMultiplayer()">▶ START</button>
  <button class="ghost" style="width:200px;margin-top:8px;" onclick="openMultiplayerLevelSelect()">⬅ Zurück</button>
</div>

<!-- ================= HUD ================= -->
<div id="hud">
  <h4>Live Ranking</h4>
  <div id="rankList"></div>
  <div id="lapInfo"></div>
  <div id="gpInfo"></div>
</div>
<div id="mpLiveRank"></div>

<button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
<button id="exitRaceBtn" class="danger" onclick="requestExit()">❌ Verlassen</button>
<button id="itemSlot" ontouchstart="usePlayerItemByIndex(0,event)" onmousedown="usePlayerItemByIndex(0,event)">
  <div class="icon" id="itemIcon">❔</div>
  <div class="charges" id="itemCharges"></div>
</button>
<div id="zoomControls">
  <button onclick="zoomIn()">＋</button>
  <button onclick="zoomOut()">－</button>
</div>

<div id="toast"></div>
<div id="countdownEl" style="display:none;"></div>
<div id="inkOverlay"></div>

<div id="finishBanner">
  <div class="eyebrow">Zieleinlauf</div>
  <h2>🏆 Rennen beendet</h2>
  <div id="finishList"></div>
  <div style="display:flex;gap:10px;">
    <button class="primary" onclick="rematch()">🔁 Nochmal</button>
    <button class="ghost" onclick="finishToMenu()">⬅ Hauptmenü</button>
  </div>
</div>

<div id="gpBanner">
  <div class="eyebrow" id="gpBannerEyebrow">Grand Prix</div>
  <h2 id="gpBannerTitle">🏆 Streckenwertung</h2>
  <div id="gpStandings"></div>
  <div style="display:flex;gap:10px;">
    <button class="primary" id="gpContinueBtn" onclick="gpContinue()">▶ Weiter</button>
    <button class="ghost" onclick="finishToMenu()">⬅ Hauptmenü</button>
  </div>
</div>

<canvas id="c"></canvas>

<script>
/* =========================================================================
   RACING ARENA ELITE — full rewrite
   ========================================================================= */

const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resizeCanvas(){
  c.width = innerWidth;
  c.height = innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* prevent iPad double-tap "copy / zoom" magnifier menu */
document.addEventListener("dblclick", e=>e.preventDefault(), {passive:false});
document.addEventListener("gesturestart", e=>e.preventDefault(), {passive:false});
document.addEventListener("contextmenu", e=>e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", e=>{
  const now = Date.now();
  if(now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

/* ================= SETTINGS ================= */
let settings = {
  controlScheme:"drag",
  graphics:"high",
  defaultZoom:0.95,
  sound:true
};
try{
  const saved = JSON.parse(localStorage.getItem("raceSettings")||"null");
  if(saved) settings = Object.assign(settings, saved);
}catch(e){}
function saveSettings(){ try{ localStorage.setItem("raceSettings", JSON.stringify(settings)); }catch(e){} }
function setControlScheme(v){ settings.controlScheme=v; saveSettings(); refreshSettingsUI(); }
function setGraphics(v){ settings.graphics=v; saveSettings(); refreshSettingsUI(); }
function setDefaultZoom(v){ settings.defaultZoom=v; saveSettings(); refreshSettingsUI(); cameraZoom=v; }
function setSound(v){ settings.sound=v; saveSettings(); refreshSettingsUI(); }
function refreshSettingsUI(){
  document.getElementById("ctrlDragBtn").classList.toggle("active", settings.controlScheme==="drag");
  document.getElementById("ctrlJoyBtn").classList.toggle("active", settings.controlScheme==="joystick");
  document.getElementById("gfxStdBtn").classList.toggle("active", settings.graphics==="standard");
  document.getElementById("gfxHighBtn").classList.toggle("active", settings.graphics==="high");
  document.getElementById("zoomNearBtn").classList.toggle("active", settings.defaultZoom===1.15);
  document.getElementById("zoomMidBtn").classList.toggle("active", settings.defaultZoom===0.95);
  document.getElementById("zoomFarBtn").classList.toggle("active", settings.defaultZoom===0.7);
  document.getElementById("soundOnBtn").classList.toggle("active", settings.sound===true);
  document.getElementById("soundOffBtn").classList.toggle("active", settings.sound===false);
}

/* ================= COOL BOT NAMES ================= */
const BOT_NAMES = [
  "Blaze","Nitro","Vortex","Comet","Raptor","Shadow","Turbo","Viper","Phantom","Cyclone",
  "Inferno","Frost","Zephyr","Titan","Nova","Havoc","Reckless Rex","Lightning Lou","Mad Maxi","Doom Wheels",
  "Speedy Sam","Crash","Bandit","Rocket Rita","Diesel","Static","Glitch","Maverick","Ace","Juggernaut",
  "Ember","Rogue","Quake","Widow","Torque","Dynamo","Falcon","Slick Rick","Ricochet","Warhead"
];
function shuffledNames(n){
  const pool=[...BOT_NAMES];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,n);
}

/* ---------------- TRACK DEFINITIONS (huge, smooth spline circuits with themes) ---------------- */
// control-point generators — sparse "anchors" that get smoothed into a dense racing line
function ctrlSunset(){
  const pts=[]; const n=16; const cx=0, cy=0;
  for(let i=0;i<n;i++){
    const t=(i/n)*Math.PI*2;
    const wobble = Math.sin(t*3)*520 + Math.sin(t*5+1.3)*260;
    const r = 2400 + wobble;
    pts.push({x:cx+Math.cos(t)*r, y:cy+Math.sin(t)*r*0.72});
  }
  return pts;
}
function ctrlSerpentine(){
  const pts=[];
  const n=13;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const x = -2900 + t*5800;
    const y = Math.sin(t*Math.PI*4.4)*950 + Math.sin(t*Math.PI*1.6)*380 - 700;
    pts.push({x,y});
  }
  for(let i=n-1;i>=0;i--){
    const t=i/(n-1);
    const x = -2900 + t*5800;
    const y = Math.sin(t*Math.PI*4.4)*950 + Math.sin(t*Math.PI*1.6)*380 + 750;
    pts.push({x,y});
  }
  return pts;
}
function ctrlGrandCircuit(){
  return [
    {x:-2600,y:0},{x:-2000,y:-800},{x:-1300,y:-1350},{x:-650,y:-800},{x:-150,y:-150},
    {x:450,y:450},{x:1050,y:1050},{x:1700,y:700},{x:2250,y:0},{x:1800,y:-750},
    {x:1200,y:-1350},{x:600,y:-800},{x:0,y:-150},{x:-600,y:600},{x:-1250,y:1250},
    {x:-1900,y:800},{x:-2550,y:300},{x:-2850,y:-450}
  ];
}
function ctrlOval(){
  const pts=[]; const n=24; const rx=2650, ry=1550;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    const wob = Math.sin(a*6)*130 + Math.sin(a*2)*90;
    pts.push({x:Math.cos(a)*(rx+wob), y:Math.sin(a)*(ry+wob*0.6)});
  }
  return pts;
}
function ctrlFigureEight(){
  const pts=[]; const n=30; const r=1850;
  for(let i=0;i<n;i++){
    const t=(i/n)*Math.PI*2;
    const x=r*Math.sin(t);
    const y=r*Math.sin(t)*Math.cos(t);
    pts.push({x:x*1.55, y:y*1.95});
  }
  return pts;
}
function ctrlZigzag(){
  const pts=[]; const teeth=8; const w=5800;
  for(let i=0;i<teeth;i++){
    const x = -w/2 + (i/(teeth-1))*w;
    const y = (i%2===0) ? -1000 : 1000;
    pts.push({x,y});
  }
  pts.push({x:w/2+350, y:250});
  pts.push({x:w/2-450, y:1550});
  pts.push({x:0, y:1900});
  pts.push({x:-w/2+450, y:1550});
  pts.push({x:-w/2-350, y:250});
  return pts;
}
function ctrlFrostSpiral(){

// catmull-rom spline: turns sparse anchor points into a smooth, dense, closed racing line
function catmullRomSpline(pts, segs){
  const n=pts.length, dense=[];
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    for(let s=0;s<segs;s++){
      const t=s/segs, t2=t*t, t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      dense.push({x,y});
    }
  }
  return dense;
}
// signed curvature per point: 0 = straight, +/- = left/right turn strength (used for AI braking + racing line)
function computeCurvatureProfile(pts){
  const n=pts.length, arr=new Array(n);
  for(let i=0;i<n;i++){
    const a=pts[(i-1+n)%n], b=pts[i], cpt=pts[(i+1)%n];
    const v1x=b.x-a.x, v1y=b.y-a.y, v2x=cpt.x-b.x, v2y=cpt.y-b.y;
    const a1=Math.atan2(v1y,v1x), a2=Math.atan2(v2y,v2x);
    arr[i]=Math.atan2(Math.sin(a2-a1),Math.cos(a2-a1));
  }
  return arr;
}
function buildTracks(){
  tracks = TRACK_DEFS.map(def=>{
    const dense = catmullRomSpline(def.gen(), def.segs||14);
    return { points:dense, curv:computeCurvatureProfile(dense), width:def.width||95, theme:def.theme, name:def.name };
  });
  applyTrackIndex(currentTrackIndex);
}
function applyTrackIndex(i){
  currentTrackIndex=i;
  const t=tracks[i];
  track=t.points; trackCurv=t.curv; trackWidth=t.width; trackTheme=t.theme;
}
buildTracks();

/* ---------------- track helpers ---------------- */
function project(px,py,a,b){
  let vx=b.x-a.x, vy=b.y-a.y;
  let wx=px-a.x, wy=py-a.y;
  let t=(wx*vx+wy*vy)/(vx*vx+vy*vy || 1);
  t=Math.max(0,Math.min(1,t));
  return {x:a.x+vx*t, y:a.y+vy*t};
}
function closest(x,y){
  let best=null, bd=Infinity;
  for(let i=0;i<track.length;i++){
    let a=track[i], b=track[(i+1)%track.length];
    let p=project(x,y,a,b);
    let d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=p;}
  }
  return best;
}
// signed curvature at index (0 = straight, larger magnitude = sharper turn)
function signedCurvatureAt(i){ return trackCurv[(i%trackCurv.length+trackCurv.length)%trackCurv.length]; }
function curvatureAt(i){ return Math.abs(signedCurvatureAt(i)); }
// look-ahead: worst (sharpest) curvature within the next `span` points — used for predictive braking
function lookaheadCurvature(i, span){
  let worst=0;
  for(let k=0;k<span;k++){
    const cv=curvatureAt(i+k);
    if(cv>worst) worst=cv;
  }
  return worst;
}

// weighted pool depending on rank fraction (0 = leader, 1 = last place) — mirrors MK Wii item balancing
function rollItem(rankFraction, totalCars){
  const pools = [];
  function add(key, w){ pools.push([key,w]); }
  if(rankFraction < 0.2){
    add("green_shell",30); add("banana",26); add("mushroom",22); add("fake_item_box",14); add("triple_banana",8);
  } else if(rankFraction < 0.45){
    add("green_shell",22); add("triple_green_shell",10); add("banana",18); add("mushroom",20);
    add("red_shell",14); add("bobomb",8); add("triple_mushroom",8);
  } else if(rankFraction < 0.7){
    add("red_shell",18); add("triple_red_shell",10); add("mushroom",14); add("triple_mushroom",12);
    add("bobomb",12); add("blooper",10); add("banana",10); add("golden_mushroom",8); add("triple_banana",6);
  } else if(rankFraction < 0.9){
    add("triple_mushroom",16); add("golden_mushroom",14); add("star",12); add("bobomb",12);
    add("blooper",10); add("triple_red_shell",10); add("bullet_bill",10); add("thundercloud",8); add("pow",8);
  } else {
    add("star",18); add("bullet_bill",18); add("golden_mushroom",14); add("blue_shell",14);
    add("lightning",10); add("pow",10); add("thundercloud",8); add("triple_mushroom",8);
  }
  const total = pools.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [key,w] of pools){ if(r<w) return key; r-=w; }
  return "mushroom";
}
function giveItem(car){
  const totalCars = cars.length || 8;
  const frac = totalCars>1 ? (car.rank-1)/(totalCars-1) : 0;
  const key = rollItem(frac, totalCars);
  car.item = key;
  car.itemCharges = key.startsWith("triple") ? 3 : 1;
  car.itemCooldown = 20;
  if(car.isPlayer) updateItemUI(car.id);
}

    const d=Math.hypot(o.x-owner.x,o.y-owner.y);

}

/* ================= CAR ================= */
const BASE_SPEED = 5.1; // identical for every car — point 1: alle sollen selben Speed haben

const PERSONALITIES = {
  aggressive: { wander:16, mistakeMul:1.15, itemAggro:1.7,  overtake:1.6, brakeLate:1.3,  apex:0.85, drafty:1.3 },
  defensive:  { wander:12, mistakeMul:0.75, itemAggro:0.65, overtake:0.8, brakeLate:0.9,  apex:1.0,  drafty:0.9, blocker:true },
  technical:  { wander:7,  mistakeMul:0.45, itemAggro:1.0,  overtake:1.05,brakeLate:1.0,  apex:1.2,  drafty:1.0 },
  wild:       { wander:32, mistakeMul:1.7,  itemAggro:1.35, overtake:1.3, brakeLate:1.15, apex:0.65, drafty:1.1 }
};
const STYLE_KEYS = Object.keys(PERSONALITIES);

class Car{
  constructor(id,name,skill=0.7,style){
    this.id=id; this.name=name; this.skill=skill;
    this.style = style || STYLE_KEYS[Math.floor(Math.random()*STYLE_KEYS.length)];
    this.personality = PERSONALITIES[this.style];
    this.laneBias = (Math.random()-0.5)*36;
    this.wanderSeed = Math.random()*1000;
    let a=track[0], b=track[1];
    this.angle=Math.atan2(b.y-a.y,b.x-a.x);
    this.x=a.x; this.y=a.y;
    this.cp=1; this.lap=0;
    this.baseSpeed = BASE_SPEED;
    this.speed=0;
    this.boostTimer=0; this.spin=0;
    this.goldenTimer=0; this.starTimer=0; this.bulletTimer=0; this.shrink=0; this.inked=0; this.thunder=0;
    this.hue=(id*63)%360;
    this.color=`hsl(${this.hue},78%,58%)`;
    this.finished=false; this.finishTime=0; this.rank=0;
    this.isPlayer=false;
    this.item=null; this.itemCharges=0;
    this.progress=0;
    this.mistakeCooldown=0;
    this.itemCooldown=60+Math.random()*120;
    this.trail=[];
    this.draftBonus=0;
  }

  // steers toward the apex of upcoming corners (inside line) and adds a personality-flavoured wander,
  // instead of just aiming at the raw next checkpoint like before
  racingLineOffset(){
    const cv = signedCurvatureAt(this.cp+3);
    const apexBias = -Math.sign(cv) * Math.min(1, Math.abs(cv)*1.6) * trackWidth * 0.4 * this.personality.apex * (0.4+this.skill*0.6);
    const wander = Math.sin((Date.now()+this.wanderSeed)*0.0016 + this.id*2.1) * this.personality.wander;
    return apexBias + wander + this.laneBias*0.6;
  }

  // scans thrown hazards (bananas/shells) ahead of the car and returns a sideways avoidance push
  hazardAvoidance(){
    let push=0;
    for(const p of projectiles){
      if(p.owner===this) continue;
      const dx=p.x-this.x, dy=p.y-this.y;
      const dist=Math.hypot(dx,dy);
      if(dist>220) continue;
      const ang=Math.atan2(dy,dx);
      const diff=Math.atan2(Math.sin(ang-this.angle),Math.cos(ang-this.angle));
      if(Math.abs(diff)<0.5){ // roughly ahead
        const detectChance = 0.4+this.skill*0.6;
        if(Math.random()<detectChance*0.3){
          const side = diff>=0 ? -1 : 1;
          push += side * (220-dist)*0.9;
        }
      }
    }
    return push;
  }

  useItemAI(){
    if(!this.item || this.itemCooldown>0) return;
    const p=this.personality;
    let rivalAheadClose = cars.some(o=>o!==this && !o.finished &&
      Math.hypot(o.x-this.x,o.y-this.y) < 190 &&
      Math.hypot(o.x-this.x,o.y-this.y) > 20 && o.progress>this.progress-500);
    let leading = cars.every(o=>o===this || o.progress<=this.progress);
    let roll = Math.random();

    const offensive = ["green_shell","triple_green_shell","red_shell","triple_red_shell","blue_shell","bobomb","pow","lightning"];
    const defensive = ["banana","triple_banana","fake_item_box","blooper"];
    const selfBoost = ["mushroom","triple_mushroom","golden_mushroom","star","bullet_bill","thundercloud"];

    let should=false;
    if(offensive.includes(this.item)){ should = (rivalAheadClose && roll<0.55*p.itemAggro) || roll<0.008*p.itemAggro; }
    else if(defensive.includes(this.item)){ should = (leading && (p.blocker || roll<0.4)) || roll<0.012; }
    else if(selfBoost.includes(this.item)){ should = roll<0.02*p.itemAggro || (rivalAheadClose && roll<0.3); }
    else should = roll<0.01;

    if(should) useItem(this);
  }

  update(){
    if(this.finished) return;
    if(this.itemCooldown>0) this.itemCooldown--;
    if(this.goldenTimer>0){ this.goldenTimer--; this.boostTimer=Math.max(this.boostTimer,10); }
    if(this.starTimer>0) this.starTimer--;
    if(this.shrink>0) this.shrink--;
    if(this.inked>0) this.inked--;
    if(this.bulletTimer>0) this.bulletTimer--;
    if(this.thunder>0){
      this.thunder--;
      if(this.thunder%40===0) this.boostTimer=Math.max(this.boostTimer,8);
      cars.forEach(o=>{ if(o!==this && !o.thunder && Math.hypot(o.x-this.x,o.y-this.y)<40){ o.thunder=this.thunder; this.thunder=0; } });
    }

    if(this.spin>0 && !this.starTimer){
      this.angle += 0.28;
      this.speed *= 0.62;
      this.spin -= 0.022;
    }

    let base=this.baseSpeed;
    if(this.boostTimer>0){ base=this.baseSpeed*1.55; this.boostTimer--; }
    if(this.starTimer>0) base=this.baseSpeed*1.4;
    if(this.bulletTimer>0) base=this.baseSpeed*2.0;
    if(this.shrink>0) base*=0.55;

    if(this.isPlayer && !this.bulletTimer){
      if(settings.controlScheme==="joystick" && this.id===0 && gameMode==="sp"){
        const stick = joySpTouch;
        if(stick.active){
          this.angle += stick.dx*0.045;
          const throttle = 1 - stick.dy*0.9;
          base *= Math.max(0.25, Math.min(1.3, throttle));
        }
      } else {
        const input = playerInputs[this.id];
        if(input){
          let dx=input.x-this.x, dy=input.y-this.y;
          let angle=Math.atan2(dy,dx);
          let diff=Math.atan2(Math.sin(angle-this.angle),Math.cos(angle-this.angle));
          this.angle += diff*0.14;
        }
      }
      this.speed = this.spin>0 && !this.starTimer ? base*0.4 : base;
    } else {
      if(this.bulletTimer>0){
        // autopilot: snap to track center at max speed
        const next=track[this.cp];
        let dx=next.x-this.x, dy=next.y-this.y;
        let ang=Math.atan2(dy,dx);
        let diff=Math.atan2(Math.sin(ang-this.angle),Math.cos(ang-this.angle));
        this.angle += diff*0.25;
        this.speed = base;
      } else {
        const p=this.personality;
        // ---- look several points down the track, not just the very next checkpoint ----
        const lookIdx = Math.min(4, Math.max(1, Math.round(1+this.speed*0.4)));
        const next=track[(this.cp+lookIdx)%track.length];
        const after=track[(this.cp+lookIdx+2)%track.length];
        let dirX=after.x-next.x, dirY=after.y-next.y;
        let len=Math.hypot(dirX,dirY)||1; dirX/=len; dirY/=len;
        let sideX=-dirY, sideY=dirX;
        let offset=this.racingLineOffset() + this.hazardAvoidance();

        if(this.mistakeCooldown>0) this.mistakeCooldown--;
        const mistakeChance = (this.inked>0 ? 0.013 : (1-this.skill)*0.0026) * p.mistakeMul;
        if(this.mistakeCooldown<=0 && Math.random()<mistakeChance){
          this.spin = Math.max(this.spin, 0.5);
          this.mistakeCooldown = 90;
        }

        let target={
          x: next.x*0.7 + after.x*0.3 + sideX*offset,
          y: next.y*0.7 + after.y*0.3 + sideY*offset
        };

        // ---- smarter traffic handling: pick whichever side has more room to overtake ----
        cars.forEach(o=>{
          if(o===this || o.finished) return;
          let d=Math.hypot(o.x-this.x,o.y-this.y);
          if(d<90){
            const ahead = o.progress>this.progress;
            const relevance = ahead ? 0.28*p.overtake : (o.speed>this.speed ? 0.1 : 0);
            if(relevance>0 && (ahead || d<45)){
              // decide pass side: whichever side of the rival has more open track
              const toRivalX=o.x-this.x, toRivalY=o.y-this.y;
              const rivalSideX=-Math.sin(this.angle), rivalSideY=Math.cos(this.angle);
              const rivalSideDot = toRivalX*rivalSideX+toRivalY*rivalSideY;
              const passDir = rivalSideDot>=0 ? -1 : 1;
              target.x += rivalSideX*passDir*trackWidth*0.5*relevance;
              target.y += rivalSideY*passDir*trackWidth*0.5*relevance;
            }
          }
        });

        let dx=target.x-this.x, dy=target.y-this.y;
        let ang=Math.atan2(dy,dx);
        let turnSpeed=0.065+this.skill*0.095;
        let diff=Math.atan2(Math.sin(ang-this.angle),Math.cos(ang-this.angle));
        this.angle += diff*turnSpeed;

        // ---- predictive braking: look ahead a variable distance based on current speed ----
        const brakeSpan = Math.round(6+this.speed*3.2);
        const worstCurve = lookaheadCurvature(this.cp, brakeSpan);
        const brakeStrength = 1.15 - this.skill*0.55*p.brakeLate;
        let cornerFactor = 1 - Math.min(0.62, (worstCurve/Math.PI) * brakeStrength);
        base *= cornerFactor;

        // ---- drafting: tuck in behind a car ahead on a straight for a small slipstream boost ----
        let drafted=false;
        cars.forEach(o=>{
          if(o===this || o.finished || drafted) return;
          const dx2=o.x-this.x, dy2=o.y-this.y, d2=Math.hypot(dx2,dy2);
          if(d2>18 && d2<95){
            const aheadAngle=Math.atan2(dy2,dx2);
            const diff2=Math.atan2(Math.sin(aheadAngle-this.angle),Math.cos(aheadAngle-this.angle));
            if(Math.abs(diff2)<0.35 && worstCurve<0.4){ drafted=true; }
          }
        });
        this.draftBonus += ((drafted?0.22*p.drafty:0) - this.draftBonus)*0.1;
        base += this.draftBonus;

        // rubber-banding keeps the pack close without removing skill differences
        let avgProgress = cars.reduce((s,o)=>s+o.progress,0)/cars.length;
        let rubberBand = Math.max(-0.22, Math.min(0.26, 0.002 * (avgProgress-this.progress)));
        base += rubberBand;

        this.speed = this.spin>0 && !this.starTimer ? base*0.4 : Math.max(1.4, base);
        this.useItemAI();
      }
    }

    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;

    let center=closest(this.x,this.y);
    let d=Math.hypot(center.x-this.x, center.y-this.y);
    if(d>trackWidth){
      this.x += (center.x-this.x)*0.09;
      this.y += (center.y-this.y)*0.09;
      this.speed *= 0.9;
    }

    let tgt=track[this.cp];
    let dist=Math.hypot(tgt.x-this.x, tgt.y-this.y);
    if(dist<120){
      this.cp++;
      if(this.cp>=track.length){
        this.cp=0; this.lap++;
        if(this.lap>=maxLaps){
          this.finished=true;
          this.finishTime=performance.now();
        }
      }
    }

    cars.forEach(o=>{
      if(o===this) return;
      let dd=Math.hypot(o.x-this.x,o.y-this.y);
      if(dd<26){
        if(this.starTimer>0 && !o.starTimer){ o.spin=Math.max(o.spin,0.8); }
        let push=(26-dd)/2;
        let nx=(this.x-o.x)/(dd||1), ny=(this.y-o.y)/(dd||1);
        this.x+=nx*push; this.y+=ny*push;
        o.x-=nx*push; o.y-=ny*push;
        this.speed*=0.92;
      }
    });

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>12) this.trail.shift();
  }

  draw(){
    if(settings.graphics==="high"){
      ctx.save();
      ctx.globalAlpha=0.22;
      for(let i=0;i<this.trail.length;i++){
        let p=this.trail[i];
        ctx.fillStyle=this.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,4*(i/this.trail.length),0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    // shadow
    ctx.save();
    ctx.globalAlpha=0.35;
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.ellipse(this.x+4,this.y+6,14,8,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);
    if(this.starTimer>0){
      const hue=(Date.now()*0.3)%360;
      ctx.fillStyle=`hsl(${hue},90%,60%)`;
      ctx.shadowColor=`hsl(${hue},90%,60%)`; ctx.shadowBlur=18;
    } else if(this.shrink>0){
      ctx.fillStyle=this.color;
    } else {
      ctx.fillStyle=this.color;
    }
    const scale = this.shrink>0 ? 0.55 : 1;
    ctx.scale(scale,scale);
    // body
    ctx.beginPath();
    ctx.moveTo(12,0); ctx.lineTo(6,-7); ctx.lineTo(-11,-7); ctx.lineTo(-11,7); ctx.lineTo(6,7);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // windshield
    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.fillRect(0,-5,6,10);
    // wheels
    ctx.fillStyle="#111";
    ctx.fillRect(-9,-9,5,4); ctx.fillRect(-9,5,5,4);
    ctx.fillRect(4,-9,5,4); ctx.fillRect(4,5,5,4);
    if(this.boostTimer>0 || this.goldenTimer>0){
      ctx.fillStyle="rgba(255,200,60,0.85)";
      ctx.beginPath(); ctx.moveTo(-11,-4); ctx.lineTo(-22,0); ctx.lineTo(-11,4); ctx.fill();
    }
    ctx.restore();

    if(this.inked>0 && this.isPlayer){ /* handled globally via overlay */ }

    ctx.fillStyle="white";
    ctx.font="12px Rajdhani, Arial";
    ctx.textAlign="center";
    ctx.fillText(this.name, this.x, this.y-20);
  }
}

/* ================= ITEM BOX ================= */
class ItemBox{
  constructor(x,y){ this.x=x; this.y=y; this.active=true; this.respawn=0; this.spin=Math.random()*Math.PI*2; }
  update(){
    this.spin+=0.05;
    if(!this.active){ this.respawn--; if(this.respawn<=0) this.active=true; }
  }
  draw(){
    if(!this.active) return;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(Math.sin(this.spin)*0.3);
    const grad=ctx.createLinearGradient(-14,-14,14,14);
    grad.addColorStop(0,"#ffe066"); grad.addColorStop(1,"#ff9d00");
    ctx.fillStyle=grad;
    ctx.fillRect(-14,-14,28,28);
    ctx.strokeStyle="white"; ctx.lineWidth=2;
    ctx.strokeRect(-14,-14,28,28);
    ctx.fillStyle="#3a2600";
    ctx.font="bold 16px Rajdhani";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("?",0,1);
    ctx.restore();
  }
  check(car){
    if(!this.active || car.item) return;
    let d=Math.hypot(car.x-this.x,car.y-this.y);
    if(d<28){ this.active=false; this.respawn=260; giveItem(car); }
  }
}
function spawnItems(){
  items=[];
  const n=Math.max(10, Math.floor(track.length*0.7));
  for(let i=0;i<n;i++){
    let idx=Math.floor((i/n)*track.length);
    let p=track[idx];
    let nx=track[(idx+1)%track.length];
    let dx=nx.x-p.x, dy=nx.y-p.y, len=Math.hypot(dx,dy)||1;
    let sideX=-dy/len, sideY=dx/len;
    let off=(Math.random()-0.5)*trackWidth*1.2;
    items.push(new ItemBox(p.x+sideX*off+ (Math.random()-0.5)*40, p.y+sideY*off+(Math.random()-0.5)*40));
  }
}

/* ================= PROJECTILES / HAZARDS ================= */
function updateProjectiles(){
  projectiles.forEach(p=>{
    p.life--;
    if(p.static){
      // banana / bobomb sit still
      if(p.type==="bobomb"){
        p.fuse--;
        if(p.fuse<=0){
          explosionsFx.push({x:p.x,y:p.y,life:34,big:true});
          cars.forEach(o=>{ if(Math.hypot(o.x-p.x,o.y-p.y)<90 && !o.starTimer) o.spin=Math.max(o.spin,1.3); });
          p.life=0;
        }
      }
      cars.forEach(o=>{
        if(o.starTimer>0) return;
        const d=Math.hypot(o.x-p.x,o.y-p.y);
        if(d<24){
          o.spin=Math.max(o.spin,1);
          explosionsFx.push({x:p.x,y:p.y,life:20});
          p.life=0;
        }
      });
      return;
    }
    if(p.type==="red_shell" && p.target && !p.target.finished){
      let dx=p.target.x-p.x, dy=p.target.y-p.y;
      let ang=Math.atan2(dy,dx);
      let diff=Math.atan2(Math.sin(ang-p.angle),Math.cos(ang-p.angle));
      p.angle += diff*0.12;
    }
    if(p.type==="blue_shell"){
      if(p.target && !p.target.finished){
        let dx=p.target.x-p.x, dy=p.target.y-p.y;
        let ang=Math.atan2(dy,dx);
        let diff=Math.atan2(Math.sin(ang-p.angle),Math.cos(ang-p.angle));
        p.angle += diff*0.06;
        p.speed = Math.min(14, p.speed+0.15);
        if(Math.hypot(dx,dy)<50){
          explosionsFx.push({x:p.target.x,y:p.target.y,life:40,big:true});
          cars.forEach(o=>{ if(Math.hypot(o.x-p.target.x,o.y-p.target.y)<110 && !o.starTimer) o.spin=Math.max(o.spin,1.5); });
          p.life=0;
        }
      }
    }
    p.x += Math.cos(p.angle)*p.speed;
    p.y += Math.sin(p.angle)*p.speed;

    // bounce green shells off track edge
    if(p.type==="green_shell" || p.type==="red_shell"){
      const ctr=closest(p.x,p.y);
      const d=Math.hypot(ctr.x-p.x,ctr.y-p.y);
      if(d>trackWidth-10 && p.bounces<6){
        let nx=(p.x-ctr.x)/(d||1), ny=(p.y-ctr.y)/(d||1);
        const normalAngle=Math.atan2(ny,nx);
        p.angle = 2*normalAngle - p.angle + Math.PI;
        p.x += nx*4; p.y += ny*4;
        p.bounces=(p.bounces||0)+1;
      }
    }

    cars.forEach(o=>{
      if(o===p.owner || o.starTimer>0) return;
      const d=Math.hypot(o.x-p.x,o.y-p.y);
      if(d<22){
        o.spin=Math.max(o.spin,1.2);
        explosionsFx.push({x:p.x,y:p.y,life:24});
        p.life=0;
      }
    });
  });
  projectiles = projectiles.filter(p=>p.life>0);
}
function drawProjectiles(){
  projectiles.forEach(p=>{
    ctx.save();
    ctx.translate(p.x,p.y);
    if(p.type==="banana"){
      ctx.fillStyle="#ffe066";
      ctx.font="20px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("🍌",0,0);
    } else if(p.type==="bobomb"){
      ctx.font="22px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("💣",0,0);
    } else if(p.type==="green_shell"){
      ctx.rotate(p.angle);
      ctx.fillStyle="#3ddc5a"; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    } else if(p.type==="red_shell"){
      ctx.rotate(p.angle);
      ctx.fillStyle="#ff4d4d"; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    } else if(p.type==="blue_shell"){
      ctx.rotate(p.angle);
      ctx.fillStyle="#4da9ff"; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="white"; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.restore();
  });
}

function updateParticles(){
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; });
  particles = particles.filter(p=>p.life>0);
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  });
}

function drawExplosions(){
  explosionsFx.forEach(e=>{
    ctx.beginPath();
    ctx.arc(e.x,e.y,(e.big?70:40)-e.life,0,Math.PI*2);
    ctx.strokeStyle=e.pow?"#ffcc00":"orange"; ctx.lineWidth=e.big?6:4; ctx.stroke();
  });
}
function updateExplosions(){
  explosionsFx.forEach(e=>e.life--);
  explosionsFx = explosionsFx.filter(e=>e.life>0);
}

/* ================= INPUT (unified pointer system) ================= */
let spPointerId=null;
c.addEventListener("pointerdown", e=>{
  if(gameMode!=="sp" || !running || paused) return;
  if(settings.controlScheme==="joystick"){
    joySpTouch.active=true; joySpTouch.id=e.pointerId; joySpTouch.baseX=e.clientX; joySpTouch.baseY=e.clientY;
    return;
  }
  spPointerId=e.pointerId;
  setSPTarget(e);
});
c.addEventListener("pointermove", e=>{
  if(gameMode!=="sp") return;
  if(settings.controlScheme==="joystick"){
    if(!joySpTouch.active || e.pointerId!==joySpTouch.id) return;
    let dx=e.clientX-joySpTouch.baseX, dy=e.clientY-joySpTouch.baseY;
    const max=60;
    const len=Math.hypot(dx,dy);
    if(len>max){ dx=dx/len*max; dy=dy/len*max; }
    joySpTouch.dx = dx/max; joySpTouch.dy = dy/max;
    return;
  }
  if(spPointerId===null || e.pointerId!==spPointerId) return;
  setSPTarget(e);
});
window.addEventListener("pointerup", e=>{
  if(e.pointerId===spPointerId) spPointerId=null;
  if(e.pointerId===joySpTouch.id){ joySpTouch.active=false; joySpTouch.dx=0; joySpTouch.dy=0; joySpTouch.id=null; }
});
function setSPTarget(e){
  let worldX=(e.clientX-c.width/2)/cameraZoom + camX;
  let worldY=(e.clientY-c.height/2)/cameraZoom + camY;
  playerInputs[0]={x:worldX,y:worldY};
}
let joySpTouch={active:false,id:null,baseX:0,baseY:0,dx:0,dy:0};

/* ================= RACE SETUP ================= */
function resetWorld(){
  cars=[]; projectiles=[]; explosionsFx=[]; items=[]; particles=[];
  playerInputs=[]; playerControls=[];
  cameraZoom=settings.defaultZoom;
  paused=false;
}

function difficultySkillRange(diff){
  if(diff==="easy") return [0.35,0.55];
  if(diff==="hard") return [0.75,0.98];
  return [0.55,0.8];
}

function buildBots(n, diff){
  const names = shuffledNames(n);
  const [lo,hi] = difficultySkillRange(diff);
  const bots=[];
  for(let i=1;i<=n;i++){
    const skill = lo + Math.random()*(hi-lo);
    bots.push(new Car(i, names[i-1] || ("Bot "+i), skill));
  }
  return bots;
}

function startRace(){
  resetWorld();
  gameMode="sp"; playerCount=1; gp=null;
  playerInputs[0]={x:0,y:0};

  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;
  let name=document.getElementById("playerName").value || "Player";
  difficulty=document.getElementById("spDifficulty").value;

  let player=new Car(0,name,0.9); player.isPlayer=true;
  cars.push(player);
  cars.push(...buildBots(n, difficulty));

  spawnItems();
  launchRaceUI();
}

function launchRaceUI(){
  document.getElementById("hud").style.display="block";
  document.getElementById("gpInfo").innerText = gp ? `GP: Strecke ${gp.stage+1}/4` : "";
  document.getElementById("mpLiveRank").style.display="none";
  document.getElementById("exitRaceBtn").style.display="block";
  document.getElementById("pauseBtn").style.display="block";
  document.getElementById("itemSlot").style.display="flex";
  updateItemUI(0);

  showOverlay(null);
  running=false;
  countdown(()=>{ running=true; raceStartTime=performance.now(); });
}

/* ---- Grand Prix ---- */
function startGrandPrix(){
  const n=+document.getElementById("gpBots").value;
  const laps=+document.getElementById("gpLaps").value;
  const name=document.getElementById("gpPlayerName").value || "Player";
  const diff=document.getElementById("gpDifficulty").value;
  const cupTracks=[];
  for(let k=0;k<4;k++) cupTracks.push((gpCupStart+k)%TRACK_DEFS.length);

  gp = {
    tracks: cupTracks,
    stage: 0,
    laps, bots:n, playerName:name, difficulty:diff,
    standings: {}
  };
  gp.standings[name]=0;
  const botNames = shuffledNames(n);
  botNames.forEach(nm=>gp.standings[nm]=0);
  gp.botNames = botNames;

  runGpStage();
}
function runGpStage(){
  resetWorld();
  gameMode="sp"; playerCount=1;
  playerInputs[0]={x:0,y:0};
  applyTrackIndex(gp.tracks[gp.stage]);
  maxLaps = gp.laps;
  difficulty = gp.difficulty;

  let player=new Car(0, gp.playerName, 0.9); player.isPlayer=true;
  cars.push(player);
  const [lo,hi]=difficultySkillRange(gp.difficulty);
  gp.botNames.forEach((nm,idx)=>{
    const skill = lo + Math.random()*(hi-lo);
    cars.push(new Car(idx+1, nm, skill));
  });

  spawnItems();
  launchRaceUI();
}
function gpAwardPoints(sortedCars){
  sortedCars.forEach((c,i)=>{
    const pts = GP_POINTS[Math.min(i,GP_POINTS.length-1)];
    gp.standings[c.name] = (gp.standings[c.name]||0) + pts;
  });
}
function showGpStandings(finalCup){
  const el=document.getElementById("gpBanner");
  document.getElementById("gpBannerEyebrow").innerText = finalCup ? "Grand Prix Ende" : `Nach Strecke ${gp.stage+1}/4`;
  document.getElementById("gpBannerTitle").innerText = finalCup ? "🏆 Cup-Gesamtwertung" : "📊 Zwischenstand";
  const sorted = Object.entries(gp.standings).sort((a,b)=>b[1]-a[1]);

  sorted.forEach((entry,i)=>{

  });
  document.getElementById("gpStandings").innerHTML=html;
  document.getElementById("gpContinueBtn").innerText = finalCup ? "🔁 Neuer Cup" : "▶ Nächste Strecke";
  document.getElementById("gpContinueBtn").onclick = finalCup ? (()=>{ document.getElementById("gpBanner").style.display="none"; backToMenu(); }) : gpContinue;
  el.style.display="flex";
}

  paused=!paused;
  document.getElementById("pauseBtn").innerText = paused ? "▶ Weiter" : "⏸ Pause";
  toast(paused ? "Pausiert" : "Weiter geht's!");
}

/* ================= COUNTDOWN ================= */
function countdown(cb){
  const el=document.getElementById("countdownEl");
  el.style.display="block";
  let n=3;
  const int=setInterval(()=>{
    if(n===0){
      el.innerText="GO!";
      setTimeout(()=>{ el.style.display="none"; clearInterval(int); cb(); },700);
      return;
    }
    el.innerText=n; n--;
  },900);
}

/* ================= ITEM USE (unified for sp + mp) ================= */
function usePlayerItemByIndex(i,e){
  if(e) e.preventDefault();
  let player=cars[i];
  if(!player || !player.item) return;
  useItem(player);
}
function updateItemUI(i){
  const player=cars[i];
  if(gameMode==="sp" && i===0){
    const iconEl=document.getElementById("itemIcon");
    const chargeEl=document.getElementById("itemCharges");
    if(player && player.item){
      const def=ITEM_DEFS[player.item];
      iconEl.innerText = def.icon;
      chargeEl.innerText = def.name + (player.itemCharges>1 ? ` x${player.itemCharges}` : "");
    } else {
      iconEl.innerText="❔"; chargeEl.innerText="kein Item";
    }
    return;
  }
  const ctrl=playerControls[i];
  if(!ctrl) return;
  const def = player && player.item ? ITEM_DEFS[player.item] : null;
  ctrl.btn.innerText = def ? (def.icon+" "+def.name) : "🎁 ITEM";
}

/* ================= MULTIPLAYER TOUCH UI ================= */
function createPlayerUI(){
  document.querySelectorAll(".pui").forEach(e=>e.remove());
  playerControls=[];

  for(let i=0;i<playerCount;i++){
    const joy=document.createElement("div");
    joy.className="pui joy-base";
    const isTop = i>=2;
    joy.style.bottom = isTop ? "auto" : "40px";
    joy.style.top = isTop ? "20px" : "auto";
    joy.style.left = (i%2===0) ? "20px" : "auto";
    joy.style.right = (i%2===1) ? "20px" : "auto";

    const stick=document.createElement("div");
    stick.className="joy-stick";
    joy.appendChild(stick);
    document.body.appendChild(joy);

    let touchId=null;
    joy.addEventListener("pointerdown", e=>{
      e.preventDefault(); joy.setPointerCapture(e.pointerId); touchId=e.pointerId;
      updateJoystick(i, joy, stick, e);
    });
    joy.addEventListener("pointermove", e=>{
      if(e.pointerId!==touchId) return;
      updateJoystick(i, joy, stick, e);
    });
    joy.addEventListener("pointerup", e=>{
      if(e.pointerId!==touchId) return;
      touchId=null; stick.style.transform="translate(-50%,-50%)";
    });

    const btn=document.createElement("button");
    btn.className="pui"; btn.innerText="🎁 ITEM";
    btn.style.position="absolute";
    btn.style.width="130px"; btn.style.height="46px"; btn.style.fontSize="12px";
    btn.style.borderRadius="12px"; btn.style.zIndex=60;
    btn.style.left = (i%2===0) ? "20px" : "auto";
    btn.style.right = (i%2===1) ? "20px" : "auto";
    btn.style.bottom = isTop ? "auto" : "170px";
    btn.style.top = isTop ? "170px" : "auto";
    document.body.appendChild(btn);
    btn.addEventListener("pointerdown", e=>{ e.preventDefault(); usePlayerItemByIndex(i,e); });

    playerControls.push({joy,stick,btn});
  }
}
function updateJoystick(i, joy, stick, e){
  const rect=joy.getBoundingClientRect();
  let dx=e.clientX-(rect.left+rect.width/2);
  let dy=e.clientY-(rect.top+rect.height/2);
  const max=40;
  const len=Math.hypot(dx,dy);
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const player=cars[i];
  if(player) playerInputs[i]={x:player.x+dx*7, y:player.y+dy*7};
}

/* ================= ZOOM ================= */
function zoomIn(){ cameraZoom=Math.min(maxZoom, cameraZoom+0.08); }
function zoomOut(){ cameraZoom=Math.max(minZoom, cameraZoom-0.08); }

/* ================= DRAW TRACK ================= */
function drawTrack(){
  const th = trackTheme || THEMES.sunset;

  // themed background
  const gGrad = ctx.createRadialGradient(camX,camY,0,camX,camY,3600);
  gGrad.addColorStop(0,th.grassA); gGrad.addColorStop(1,th.grassB);
  ctx.fillStyle=gGrad;
  ctx.fillRect(camX-4000, camY-4000, 8000, 8000);
  if(settings.graphics==="high"){
    ctx.save();
    ctx.globalAlpha=0.06;
    ctx.strokeStyle="#ffffff";
    for(let gx=-4000;gx<4000;gx+=120){
      ctx.beginPath(); ctx.moveTo(camX+gx,camY-4000); ctx.lineTo(camX+gx,camY+4000); ctx.stroke();
    }
    ctx.restore();
  }

  // tire/energy barrier — themed border color
  ctx.strokeStyle=th.border; ctx.lineWidth=trackWidth*2+18;
  ctx.beginPath(); ctx.moveTo(track[0].x,track[0].y);
  for(const p of track) ctx.lineTo(p.x,p.y);
  ctx.closePath(); ctx.setLineDash([26,10]); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle="#f4f4f4"; ctx.lineWidth=trackWidth*2+8;
  ctx.beginPath(); ctx.moveTo(track[0].x,track[0].y);
  for(const p of track) ctx.lineTo(p.x,p.y);
  ctx.closePath(); ctx.stroke();

  // road surface
  ctx.strokeStyle=th.road; ctx.lineWidth=trackWidth*2;
  ctx.beginPath(); ctx.moveTo(track[0].x,track[0].y);
  for(const p of track) ctx.lineTo(p.x,p.y);
  ctx.closePath(); ctx.stroke();

  ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=3;
  ctx.setLineDash([16,16]); ctx.stroke(); ctx.setLineDash([]);

  // periodic apex/curb markers (sparse, since the path is now a dense spline)
  ctx.strokeStyle=th.line; ctx.lineWidth=6;
  const curbStep = Math.max(4, Math.round(track.length/24));
  for(let i=0;i<track.length;i+=curbStep){
    const a=track[i], b=track[(i+1)%track.length];
    let dx=b.x-a.x, dy=b.y-a.y;
    const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
    const nx=-dy, ny=dx, size=trackWidth;
    ctx.beginPath();
    ctx.moveTo(a.x-nx*size,a.y-ny*size);
    ctx.lineTo(a.x+nx*size,a.y+ny*size);
    ctx.stroke();
  }

  // start/finish checkerboard at index 0
  ctx.save();
  const a=track[0], b=track[1];
  let dx=b.x-a.x, dy=b.y-a.y; const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
  const nx=-dy, ny=dx;
  for(let s=-trackWidth;s<trackWidth;s+=18){
    const dark=(Math.floor((s+trackWidth)/18))%2===0;
    ctx.fillStyle= dark?"#111":"#eee";
    ctx.fillRect(a.x+nx*s-6, a.y+ny*s-6, 12,12);
  }
  ctx.restore();
}

/* ================= SCORE / HUD ================= */
function updateHud(){
  cars.forEach(c=>{
    if(c.finished) return;
    const target=track[c.cp];
    const dist=Math.hypot(target.x-c.x,target.y-c.y);
    c.progress = c.lap*100000 + c.cp*1000 - dist;
  });

  const sorted=[...cars].sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.progress-a.progress;
  });
  sorted.forEach((c,i)=>c.rank=i+1);

  if(gameMode==="sp"){
    const me=cars.find(c=>c.isPlayer);
    let html="";
    sorted.slice(0,8).forEach(c=>{
      html += `<div class="${c.isPlayer?'me':''}">${c.rank}. ${c.name}</div>`;
    });
    document.getElementById("rankList").innerHTML=html;
    document.getElementById("lapInfo").innerText = me ? `Runde ${Math.min(me.lap+1,maxLaps)} / ${maxLaps}` : "";
    document.getElementById("inkOverlay").style.display = (me && me.inked>0) ? "block" : "none";
  } else {
    let html="<b>🏁 TOP 10</b><br>";
    sorted.slice(0,10).forEach(c=>{ html+=`${c.rank}. ${c.name}<br>`; });
    document.getElementById("mpLiveRank").innerHTML=html;
  }

  if(running && cars.every(c=>c.finished)){
    running=false;
    if(gp){
      gpAwardPoints(sorted);
      showGpStandings(gp.stage>=3);
    } else {
      showFinishBanner(sorted);
    }
  }
}

function showFinishBanner(sorted){
  const el=document.getElementById("finishBanner");
  let html="";
  sorted.forEach((c,i)=>{
    html += `<div class="${i===0?'p1':''} ${c.isPlayer?'me':''}">${i+1}. ${c.name}</div>`;
  });
  document.getElementById("finishList").innerHTML=html;
  el.style.display="flex";
}
function rematch(){
  document.getElementById("finishBanner").style.display="none";
  if(gameMode==="sp") startRace(); else startMultiplayer();
}
function finishToMenu(){ endRace(true); }

/* ================= MAIN LOOP ================= */
function loop(){
  ctx.clearRect(0,0,c.width,c.height);

  // camera follows the primary player (sp) — needed for the much larger tracks
  if(cars.length){
    const focus = cars.find(c=>c.isPlayer) || cars[0];
    camX += (focus.x-camX)*0.12;
    camY += (focus.y-camY)*0.12;
  }

  ctx.save();
  ctx.translate(c.width/2,c.height/2);
  ctx.scale(cameraZoom,cameraZoom);
  ctx.translate(-camX,-camY);

  if(track) drawTrack();

  if(!paused){
    updateProjectiles();
    updateExplosions();
    updateParticles();
    items.forEach(i=>i.update());
  }

  items.forEach(i=>i.draw());
  drawProjectiles();
  drawExplosions();
  drawParticles();

  cars.forEach(car=>{
    if(!paused){
      if(running) car.update();
      items.forEach(i=>i.check(car));
    }
    car.draw();
  });

  if(cars.length) updateHud();

  ctx.restore();
  requestAnimationFrame(loop);
}

/* ================= INIT ================= */
refreshSettingsUI();
loop();
</script>
