<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Arena Fixed + Steering</title>

<style>
body{margin:0;overflow:hidden;background:#1b1b1b;font-family:Arial;}
canvas{display:block;}

#ui{
position:absolute;top:10px;left:10px;
background:rgba(0,0,0,0.75);
padding:12px;border-radius:10px;
width:260px;color:white;
}

input,button{
width:100%;margin-top:6px;padding:8px;
border:none;border-radius:6px;
}

button{background:#00c27a;color:white;font-weight:bold;}

#score{margin-top:10px;font-size:13px;}

/* ===== LENKRAD ===== */
#wheel{
position:absolute;
right:40px;
bottom:40px;
width:140px;
height:140px;
border-radius:50%;
border:4px solid white;
opacity:0.7;
touch-action:none;
}

#indicator{
position:absolute;
left:50%;
top:50%;
width:6px;
height:40px;
background:red;
transform-origin:bottom center;
transform:translate(-50%,-100%) rotate(0deg);
border-radius:3px;
}
</style>
</head>

<body>

<div id="ui">
<h3>🏁 Racing Arena</h3>

Bots:
<input id="bots" type="number" value="6">

Runden:
<input id="laps" type="number" value="5">

<button onclick="start()">START</button>

<div id="score"></div>
</div>

<div id="wheel">
  <div id="indicator"></div>
</div>

<canvas id="c"></canvas>

<script>

const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const cx=c.width/2;
const cy=c.height/2;

// ================= TRACK =================
const track=[
  {x:cx+300,y:cy},
  {x:cx+200,y:cy-200},
  {x:cx-100,y:cy-220},
  {x:cx-300,y:cy-50},
  {x:cx-200,y:cy+200},
  {x:cx+100,y:cy+220}
];

const trackWidth=70;

// ================= PLAYER STEERING =================
let steer=0;

const wheel=document.getElementById("wheel");
const indicator=document.getElementById("indicator");

function setSteer(e){
  const rect=wheel.getBoundingClientRect();
  const x=e.clientX-rect.left-rect.width/2;
  const y=e.clientY-rect.top-rect.height/2;

  steer=Math.max(-1,Math.min(1,x/60));

  indicator.style.transform=`translate(-50%,-100%) rotate(${steer*120}deg)`;
}

wheel.addEventListener("pointerdown",()=>wheel.setPointerCapture(event.pointerId));
wheel.addEventListener("pointermove",(e)=>{
  if(e.pressure>0 || e.buttons>0) setSteer(e);
});

// ================= CAR =================
class Car{
  constructor(i,name){

    this.name=name;

    this.x=track[0].x;
    this.y=track[0].y;

    this.cp=1;
    this.lap=0;

    this.angle=0;
    this.speed=2;

    this.color=`hsl(${i*50},80%,60%)`;

    this.finished=false;

    this.wander=Math.random()*2-1;
  }

  update(){

    if(this.finished) return;

    let target=track[this.cp];

    // 🔥 BOT RANDOMNESS (nicht mehr rail-like)
    target={
      x:target.x+(Math.random()-0.5)*40,
      y:target.y+(Math.random()-0.5)*40
    };

    let dx=target.x-this.x;
    let dy=target.y-this.y;

    let ang=Math.atan2(dy,dx);

    this.angle += (ang-this.angle)*0.08;

    this.speed=2.5+Math.random()*1.2;

    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;

    let dist=Math.hypot(dx,dy);

    if(dist<50){
      this.cp++;
      if(this.cp>=track.length){
        this.cp=0;
        this.lap++;
        if(this.lap>=maxLaps) this.finished=true;
      }
    }

    // collision
    cars.forEach(o=>{
      if(o===this) return;
      let d=Math.hypot(o.x-this.x,o.y-this.y);
      if(d<22){
        let push=(22-d)/2;
        let nx=(this.x-o.x)/d;
        let ny=(this.y-o.y)/d;
        this.x+=nx*push;
        this.y+=ny*push;
        o.x-=nx*push;
        o.y-=ny*push;
      }
    });
  }

  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    ctx.fillStyle=this.color;
    ctx.fillRect(-10,-6,20,12);

    ctx.restore();
  }
}

// ================= PLAYER CAR =================
class Player extends Car{
  constructor(){
    super(999,"You");
    this.color="white";
  }

  update(){

    let targetAngle=this.angle+steer*0.08;

    this.angle += (targetAngle-this.angle)*0.2;

    this.speed=3;

    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;
  }
}

let cars=[];
let player;
let maxLaps=5;
let running=false;

// ================= START =================
function start(){

  cars=[];
  let n=+document.getElementById("bots").value;
  maxLaps=+document.getElementById("laps").value;

  player=new Player();
  cars.push(player);

  for(let i=0;i<n;i++){
    cars.push(new Car(i,"Bot "+(i+1)));
  }

  running=true;
}

// ================= TRACK =================
function drawTrack(){

  ctx.strokeStyle="#555";
  ctx.lineWidth=trackWidth*2;

  ctx.beginPath();
  ctx.moveTo(track[0].x,track[0].y);
  for(let p of track) ctx.lineTo(p.x,p.y);
  ctx.closePath();
  ctx.stroke();

  // finish line (START POSITION FIX 🚩)
  let a=track[track.length-1];
  let b=track[0];

  ctx.strokeStyle="white";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(b.x-30,b.y-30);
  ctx.lineTo(b.x+30,b.y+30);
  ctx.stroke();

  // checkpoints
  ctx.fillStyle="yellow";
  track.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,6,0,Math.PI*2);
    ctx.fill();
  });
}

// ================= SCORE =================
function score(){

  let sorted=[...cars].sort((a,b)=>b.lap-a.lap);

  let html="<h3>🏆 Ranking</h3>";

  sorted.forEach((c,i)=>{
    html+=`${i+1}. ${c.name} | Lap ${c.lap}<br>`;
  });

  document.getElementById("score").innerHTML=html;
}

// ================= LOOP =================
function loop(){

  ctx.clearRect(0,0,c.width,c.height);

  drawTrack();

  cars.forEach(c=>{
    if(running)c.update();
    c.draw();
  });

  score();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
